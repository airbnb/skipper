# Builds the Astro site in web/ and publishes it to GitHub Pages.
#
# The JVM build stays on CircleCI (.circleci/config.yml); this workflow exists because
# deploying to Pages needs GitHub's own OIDC token, which only GitHub Actions can mint.
# The two do not overlap: nothing here touches Gradle, and CircleCI never builds web/.
#
# Repository setup, done once: Settings > Pages > Build and deployment > Source must be
# "GitHub Actions". Without it, the deploy step fails with a 404 on the Pages API.
#
# The published origin is https://airbnb.github.io/skipper/ — a project site, so the
# whole site lives under the /skipper/ path prefix. astro.config.mjs takes both the
# origin and that prefix from the environment (SKIPPER_SITE_URL / SKIPPER_SITE_BASE),
# so a later move to a custom domain or to the S3/CloudFront origin is a change to the
# two `env` values below, not a code change.
name: Pages

on:
  push:
    branches: [main]
    # Docs-only pushes are the common case, and a Gradle-only push has no reason to
    # redeploy the site. Keep the trigger narrow so main's history stays readable.
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  # Lets a maintainer republish without an empty commit — useful after flipping the
  # Pages source, or to recover from a failed deploy.
  workflow_dispatch:

permissions:
  contents: read
  # Both are required by actions/deploy-pages: `pages` to create the deployment, and
  # `id-token` for the OIDC token it exchanges for upload credentials.
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` because cancelling a half-finished
# deploy can leave Pages serving a partially uploaded artifact; queueing is cheap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro 5 requires Node 18.20.8+, 20.3.0+, or 22+. Pinning the major keeps CI
          # from silently following the runner image's default.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ci`, not `install`: fails on a package-lock.json that has drifted from
      # package.json rather than quietly resolving something else.
      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web
        env:
          SKIPPER_SITE_URL: https://airbnb.github.io/skipper
          SKIPPER_SITE_BASE: /skipper

      # Only main's build is a deploy candidate. On a pull request the job above is the
      # whole point — it catches a broken build before merge, which CircleCI cannot.
      - name: Upload the built site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Surfaces the live URL on the repo's Environments page and in the run summary,
    # and is the hook for branch protection rules on deployments.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
