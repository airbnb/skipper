# GitHub Actions configuration for airbnb/skipper: model-checks the TLA+ specifications under
# formal/ and checks that the engine still behaves as they describe. See formal/tla/README.md for
# what the models cover and formal/tla/trace/README.md for trace validation.
#
#   tla-model-check  Runs formal/tla/check.sh, which model-checks every config in
#                    formal/tla/models/ with TLC and compares each verdict with the one the
#                    config records on its `\* expect:` line. Some models record a known engine
#                    bug as their expected violation, so the job is green while nothing changes
#                    and red when a verdict moves: a model edit that breaks a property, or a fix
#                    whose model now passes but still expects the violation (update its expect:
#                    line in the same change). TLC's full output, counterexample traces included,
#                    is stored as a run artifact.
#
#   trace-validation Runs the engine's end-to-end test suites with trace recording on
#                    (formal/tla/trace/record_traces.sh), then checks every recorded workflow run
#                    against the model (check_traces.sh --self-test). Red when the engine takes a
#                    step the model says it cannot, meaning the code or the spec has drifted, or when
#                    the self-test finds the checker accepting a corrupted trace. The recorded traces
#                    and TLC's output are stored as run artifacts.
#
# Both jobs run when the model, the engine, or the test harness changes; nothing else can move a
# verdict. Neither is a required check: the main branch ruleset requires `jvm-build` only, and a
# path-filtered check cannot be required without leaving other pull requests waiting on it.
#
# TLC is pinned to a release and its checksum verified, so a new TLA+ release cannot change a
# verdict without a change here.

name: formal

on:
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "src/main/**"
      - "testutils/**"
      - "build.gradle.kts"
      - ".github/workflows/formal.yml"
  pull_request:
    paths:
      - "formal/**"
      - "src/main/**"
      - "testutils/**"
      - "build.gradle.kts"
      - ".github/workflows/formal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TLA_TOOLS_VERSION: v1.7.4
  TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

jobs:
  tla-model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # TLC needs Java 11 or newer; 17 matches the other jobs.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Download TLC ${{ env.TLA_TOOLS_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/$TLA_TOOLS_VERSION/tla2tools.jar"
          echo "$TLA_TOOLS_SHA256  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check -

      - name: Model-check formal/tla
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
          OUT_DIR: ${{ runner.temp }}/tlc
        run: formal/tla/check.sh

      - name: Store TLC output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tlc-output
          path: |
            ${{ runner.temp }}/tlc/*.out
          if-no-files-found: ignore

  trace-validation:
    runs-on: ubuntu-latest
    # Long traces are not yet bounded (see formal/tla/trace/README.md); cap the job meanwhile.
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Gradle caches
        # Same keys as jvm-build.yml, read-only: the JVM build saves them.
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle.kts', 'skipper-state-machine/build.gradle.kts', 'testutils/build.gradle.kts', 'plugins/prometheus/build.gradle.kts') }}
          restore-keys: |
            gradle-v1-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Download TLC ${{ env.TLA_TOOLS_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/$TLA_TOOLS_VERSION/tla2tools.jar"
          echo "$TLA_TOOLS_SHA256  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check -

      - name: Record traces from the end-to-end suites
        run: formal/tla/trace/record_traces.sh "$RUNNER_TEMP/traces"

      - name: Check the traces against the model
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
          OUT_DIR: ${{ runner.temp }}/trace-check
          JOBS: 4
        run: formal/tla/trace/check_traces.sh --self-test "$RUNNER_TEMP/traces"

      - name: Store traces and TLC output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trace-validation
          path: |
            ${{ runner.temp }}/traces
            ${{ runner.temp }}/trace-check/**/MC.*
            ${{ runner.temp }}/trace-check/**/tlc.out
            ${{ runner.temp }}/trace-check/*.jsonl
          if-no-files-found: ignore
