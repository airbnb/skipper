  // ===================================================================================================================
  // Timeline: a network-waterfall view of everything that happened to one workflow
  //
  // Built entirely from what the detail endpoint already returns plus the signals and child-workflow
  // listings. Every retry of an action is stored as its own checkpoint under the same tag, so a tag's
  // checkpoints in start order are its attempts, and the gaps between them are the retry backoffs.
  // ===================================================================================================================

  const Timeline = (function() {
    const KINDS = [
      { key: 'action', label: 'Actions', swatch: 'c-ok' },
      { key: 'timer', label: 'Timers', swatch: 'c-timer' },
      { key: 'signal', label: 'Signals', swatch: 'c-signal' },
      { key: 'child', label: 'Child workflows', swatch: 'c-child' },
      { key: 'task', label: 'Scheduler tasks', swatch: 'c-task' }
    ];
    // Idle stretches longer than this (in ms of real time) are drawn with a break mark when compressed.
    const IDLE_BREAK_MS = 60000;

    let st = null;

    function init(data) {
      st = {
        data: data,
        signals: null,
        children: null,
        linear: false,
        kinds: { action: true, timer: true, signal: true, child: true, task: false },
        collapsed: {},
        selected: null,
        model: null
      };
      renderKindChips();
      $('#tl-scale').on('click', 'button', function() {
        st.linear = $(this).data('v') === 'linear';
        render();
      });
      $('#tl-expand').on('click', 'button', function() {
        const collapse = $(this).data('v') === 'collapse';
        st.model.rows.forEach(function(r) { if (r.expandable) st.collapsed[r.id] = collapse; });
        render();
      });
      rebuild();
    }

    // Signals and children arrive from separate requests; redraw as each one lands.
    function setSignals(signals) { if (st) { st.signals = signals; rebuild(); } }
    function setChildren(children) { if (st) { st.children = children; rebuild(); } }

    function renderKindChips() {
      $('#tl-kinds').html(KINDS.map(function(k) {
        return '<button class="chip ' + (st.kinds[k.key] ? '' : 'off') + '" data-kind="' + k.key + '"><i class="' + k.swatch + '"></i>' + k.label + '</button>';
      }).join('')).off('click').on('click', 'button', function() {
        const k = $(this).data('kind');
        st.kinds[k] = !st.kinds[k];
        renderKindChips();
        render();
      });
    }

    function rebuild() {
      const prevSelected = st.selected;
      st.model = buildModel(st.data, st.signals || [], st.children || []);
      // Collapse attempt groups by default only when the list would otherwise get long.
      const groups = st.model.rows.filter(function(r) { return r.expandable; });
      groups.forEach(function(r) {
        if (st.collapsed[r.id] === undefined) st.collapsed[r.id] = st.model.rows.length > 40;
      });
      st.selected = prevSelected && rowById(prevSelected) ? prevSelected : defaultSelection();
      render();
    }

    function rowById(id) {
      return st.model.rows.find(function(r) { return r.id === id; });
    }

    // The most interesting row: the latest action still retrying or failed, else the latest retried one.
    function defaultSelection() {
      const actions = st.model.rows.filter(function(r) { return r.kind === 'action'; });
      const failing = actions.filter(function(r) { return r.statusCls !== 't-ok'; });
      const retried = actions.filter(function(r) { return r.attempts.length > 1; });
      const pick = failing[failing.length - 1] || retried[retried.length - 1] || actions[actions.length - 1] || st.model.rows[0];
      return pick ? pick.id : null;
    }

    // ---------------------------------------------------------------------------------------------- model

    function buildModel(d, signals, children) {
      const inst = d.instance;
      const now = Date.now();
      const terminal = isTerminal(inst.status);
      const t0 = toMillis(inst.created_at);
      const wfEnd = terminal ? toMillis(inst.updated_at) : now;
      const timeout = toMillis(inst.timeout_time);
      const pendingTask = (d.tasks || []).find(function(t) { return t.status === 'PENDING'; });
      const rows = [];

      rows.push({
        id: 'wf', kind: 'workflow', icon: 'W', iconCls: 'c-wf', typeLabel: 'Workflow',
        label: (inst.workflow_method || 'workflow') + '()', status: prettyStatus(inst.status), statusCls: textClassFor(inst.status),
        start: t0, end: wfEnd, durText: formatDuration(wfEnd - t0) + (terminal ? '' : '…'),
        bars: [{ s: t0, e: wfEnd, cls: 'c-wf', thin: true }]
          .concat(!terminal && timeout && timeout > now ? [{ s: now, e: timeout, cls: 'c-wf', ghost: true }] : [])
      });

      buildActionRows(d.checkpoints || [], inst, terminal, now, pendingTask).forEach(function(r) { rows.push(r); });
      buildTimerRows(d.timers || [], d.checkpoints || [], signals, children, now, wfEnd).forEach(function(r) { rows.push(r); });

      signals.forEach(function(sig, i) {
        const t = toMillis(sig.created_at);
        if (t === null) return;
        const cls = sig.status === 'FAILED' ? 'c-err' : sig.status === 'EXECUTED' ? 'c-signal' : 'c-warn';
        rows.push({
          id: 'sig:' + sig.id, kind: 'signal', icon: 'S', iconCls: 'c-signal', typeLabel: 'Signal',
          label: sig.signal_method, status: prettyStatus(sig.status), statusCls: sig.status === 'FAILED' ? 't-err' : 't-signal',
          start: t, end: t, durText: '—', marks: [{ t: t, cls: cls, label: sig.status === 'FAILED' ? 'failed' : '' }],
          signalIndex: i, source: sig
        });
      });

      children.forEach(function(wf) {
        const s = toMillis(wf.created_at);
        if (s === null) return;
        const e = isTerminal(wf.status) ? toMillis(wf.updated_at) : now;
        rows.push({
          id: 'child:' + wf.workflow_id, kind: 'child', icon: 'C', iconCls: 'c-child', typeLabel: 'Child',
          label: simpleClassName(wf.workflow_class) + '.' + wf.workflow_method, linkOut: true,
          status: prettyStatus(wf.status), statusCls: textClassFor(wf.status),
          start: s, end: e, durText: formatDuration(e - s) + (isTerminal(wf.status) ? '' : '…'),
          bars: [{ s: s, e: e, cls: isTerminal(wf.status) && wf.status !== 'COMPLETED' ? 'c-err' : 'c-child' }], source: wf
        });
      });

      (d.tasks || []).forEach(function(task) {
        const c = toMillis(task.created_at), ra = toMillis(task.run_after);
        if (c === null) return;
        const end = Math.max(c, ra || c);
        const bars = end > now
          ? [{ s: c, e: Math.max(c, now), cls: 'c-task', hatch: true }, { s: Math.max(c, now), e: end, cls: 'c-task', ghost: true, label: 'runs ' + relativeTo(end, now) }]
          : [{ s: c, e: end, cls: 'c-task', hatch: true }];
        rows.push({
          id: 'task:' + task.id, kind: 'task', icon: 'Q', iconCls: 'c-task', typeLabel: 'Task',
          label: task.type.toLowerCase() + ' task', status: prettyStatus(task.status), statusCls: textClassFor(task.status),
          start: c, end: end, durText: formatDuration(end - c), bars: bars, source: task
        });
      });

      // Chronological, with each group's attempt rows kept directly under it.
      const top = rows.filter(function(r) { return !r.parent; });
      const subs = rows.filter(function(r) { return r.parent; });
      top.sort(function(a, b) { return a.kind === 'workflow' ? -1 : b.kind === 'workflow' ? 1 : a.start - b.start; });
      const ordered = [];
      top.forEach(function(r) {
        ordered.push(r);
        subs.filter(function(s) { return s.parent === r.id; }).forEach(function(s) { ordered.push(s); });
      });

      // A finished workflow's axis ends with it: planned-but-unreached waits (dashed) are clipped there.
      let tEnd = wfEnd;
      ordered.forEach(function(r) {
        (r.bars || []).forEach(function(b) { if (!(terminal && b.ghost)) tEnd = Math.max(tEnd, b.e); });
      });
      if (terminal) {
        ordered.forEach(function(r) {
          r.bars = (r.bars || []).filter(function(b) { return !b.ghost || b.s < tEnd; })
            .map(function(b) { return b.ghost ? Object.assign({}, b, { e: Math.min(b.e, tEnd) }) : b; });
        });
      }
      if (!terminal && timeout) tEnd = Math.max(tEnd, timeout);
      return { rows: ordered, t0: t0, tEnd: Math.max(tEnd, t0 + 1), now: now, terminal: terminal, timeout: timeout };
    }

    function checkpointKey(tag) {
      return [tag.action_class, tag.action_method, tag.iteration, tag.checkpoint_name || ''].join('|');
    }

    function buildActionRows(checkpoints, inst, terminal, now, pendingTask) {
      const groups = [];
      const byKey = {};
      checkpoints.forEach(function(cp) {
        const key = checkpointKey(cp.checkpoint_tag);
        if (!byKey[key]) {
          byKey[key] = { key: key, tag: cp.checkpoint_tag, attempts: [] };
          groups.push(byKey[key]);
        }
        byKey[key].attempts.push(cp);
      });
      groups.forEach(function(g) {
        g.attempts.sort(function(a, b) { return toMillis(a.execution_start_time) - toMillis(b.execution_start_time); });
        g.start = toMillis(g.attempts[0].execution_start_time);
      });
      groups.sort(function(a, b) { return a.start - b.start; });
      const latest = groups[groups.length - 1];

      const rows = [];
      groups.forEach(function(g, gi) {
        const tag = g.tag;
        const id = 'act:' + g.key;
        const last = g.attempts[g.attempts.length - 1];
        const lastEnd = toMillis(last.execution_end_time);
        const bars = [], subRows = [], steps = [];
        g.attempts.forEach(function(cp, i) {
          const s = toMillis(cp.execution_start_time);
          const e = toMillis(cp.execution_end_time);
          const running = e === null;
          const cls = running ? 'c-timer' : cp.isSuccessful ? 'c-ok' : cp.transient ? 'c-warn' : 'c-err';
          const err = cp.isSuccessful ? null : errorInfo(cp.result);
          bars.push({ s: s, e: running ? now : e, cls: cls });
          steps.push({ label: 'Attempt ' + (i + 1), s: s, e: running ? now : e, cls: cls, running: running });
          subRows.push({
            id: id + '#' + i, parent: id, kind: 'attempt', typeLabel: 'Attempt', label: 'attempt ' + (i + 1),
            status: running ? 'Running' : cp.isSuccessful ? 'OK' : cp.transient ? 'Transient' : 'Failed',
            statusCls: running ? 't-timer' : cp.isSuccessful ? 't-ok' : cp.transient ? 't-warn' : 't-err',
            start: s, end: running ? now : e, durText: formatDuration((running ? now : e) - s) + (running ? '…' : ''),
            bars: [{ s: s, e: running ? now : e, cls: cls, label: err ? err.message : '' }], checkpoint: cp, groupId: id
          });
          const next = g.attempts[i + 1];
          if (next && e !== null) {
            const ns = toMillis(next.execution_start_time);
            bars.push({ s: e, e: ns, cls: 'c-wait', hatch: true });
            steps.push({ label: 'Backoff', s: e, e: ns, cls: 'c-wait', backoff: true });
            subRows.push({
              id: id + '#b' + i, parent: id, kind: 'backoff', typeLabel: 'Backoff', label: 'backoff', status: 'Waited', statusCls: 't-wait',
              start: e, end: ns, durText: formatDuration(ns - e), bars: [{ s: e, e: ns, cls: 'c-wait', hatch: true }], groupId: id
            });
          }
        });

        // The workflow's pending task is when the next attempt of its latest still-retrying action runs.
        let status, statusCls, nextAttempt = null;
        if (lastEnd === null) {
          status = 'Running'; statusCls = 't-timer';
        } else if (last.isSuccessful) {
          status = 'OK'; statusCls = 't-ok';
        } else if (!last.transient) {
          status = 'Failed'; statusCls = 't-err';
        } else if (inst.status === 'RETRIES_EXHAUSTED') {
          status = 'Exhausted'; statusCls = 't-err';
        } else if (!terminal && gi === groups.length - 1 && g === latest && pendingTask && toMillis(pendingTask.run_after) > lastEnd) {
          status = 'Backoff'; statusCls = 't-warn';
          nextAttempt = toMillis(pendingTask.run_after);
        } else {
          status = 'Transient'; statusCls = 't-warn';
        }
        if (nextAttempt) {
          const waitedTo = Math.min(now, nextAttempt);
          bars.push({ s: lastEnd, e: waitedTo, cls: 'c-wait', hatch: true });
          if (nextAttempt > now) bars.push({ s: now, e: nextAttempt, cls: 'c-wait', ghost: true });
          steps.push({ label: 'Next attempt', s: lastEnd, e: nextAttempt, cls: 'c-wait', backoff: true, pending: true });
          subRows.push({
            id: id + '#next', parent: id, kind: 'backoff', typeLabel: 'Scheduled', label: 'next attempt', status: 'Pending', statusCls: 't-timer',
            start: lastEnd, end: nextAttempt, durText: formatDuration(nextAttempt - lastEnd),
            bars: [{ s: lastEnd, e: waitedTo, cls: 'c-wait', hatch: true }].concat(nextAttempt > now
              ? [{ s: now, e: nextAttempt, cls: 'c-wait', ghost: true, label: 'runs ' + relativeTo(nextAttempt, now) }] : []),
            groupId: id
          });
        }

        const end = Math.max.apply(null, bars.map(function(b) { return b.e; }));
        const hasRetries = g.attempts.length > 1 || nextAttempt !== null;
        rows.push({
          id: id, kind: 'action', icon: 'A', iconCls: statusCls === 't-ok' ? 'c-ok' : statusCls === 't-err' ? 'c-err' : statusCls === 't-timer' ? 'c-timer' : 'c-warn',
          typeLabel: tag.checkpoint_name ? 'Checkpoint' : 'Action',
          label: tag.checkpoint_name || (simpleClassName(tag.action_class) + '.' + tag.action_method),
          sub: '#' + tag.iteration,
          tagText: g.attempts.length > 1 ? g.attempts.length + ' attempts' : (nextAttempt ? 'retrying' : ''),
          status: status, statusCls: statusCls, start: g.start, end: end,
          durText: formatDuration(end - g.start) + (lastEnd === null || nextAttempt ? '…' : ''),
          bars: bars, expandable: hasRetries, attempts: g.attempts, steps: steps, tag: tag, nextAttempt: nextAttempt
        });
        if (hasRetries) subRows.forEach(function(r) { rows.push(r); });
      });
      return rows;
    }

    // A timer does not record when it was cancelled. A cancelled wait ended at the first thing that
    // happened after the timer was set (a signal, a child workflow starting, the next action), so
    // that event is where the wait is drawn to end; the rest of the planned duration is dashed.
    function buildTimerRows(timers, checkpoints, signals, children, now, wfEnd) {
      const events = [];
      checkpoints.forEach(function(cp) { events.push(toMillis(cp.execution_start_time)); });
      signals.forEach(function(s) { events.push(toMillis(s.created_at)); });
      children.forEach(function(c) { events.push(toMillis(c.created_at)); });
      return timers.map(function(timer) {
        const c = toMillis(timer.created_at), x = toMillis(timer.expires_at);
        let bars, end, status = prettyStatus(timer.status), statusCls = 't-timer', note = '';
        if (timer.status === 'CANCELLED') {
          const after = events.filter(function(t) { return t !== null && t > c && t <= x; }).sort(function(a, b) { return a - b; });
          // No later event: the wait ended no later than the workflow's last update.
          end = after.length ? after[0] : Math.max(c, Math.min(x, wfEnd));
          bars = [{ s: c, e: end, cls: 'c-timer', hatch: true, label: 'cancelled' }, { s: end, e: x, cls: 'c-timer', ghost: true }];
          statusCls = 't-wait';
          note = after.length ? 'Ended by the next event, ' + formatDuration(end - c) + ' into the wait.' : '';
        } else if (timer.status === 'EXPIRED') {
          end = x;
          bars = [{ s: c, e: x, cls: 'c-timer', hatch: true }];
          statusCls = 't-ok';
        } else {
          end = Math.min(now, x);
          bars = [{ s: c, e: end, cls: 'c-timer', hatch: true }];
          if (x > now) bars.push({ s: now, e: x, cls: 'c-timer', ghost: true, label: 'expires ' + relativeTo(x, now) });
        }
        return {
          id: 'timer:' + timer.id, kind: 'timer', icon: 'T', iconCls: 'c-timer',
          typeLabel: 'Timer', label: 'timer ' + timer.id, status: status, statusCls: statusCls,
          start: c, end: Math.max(end, x), durText: formatDuration(end - c) + (timer.status === 'ACTIVE' ? '…' : ''),
          bars: bars, source: timer, note: note
        };
      });
    }

    // The one-line summary of a failed attempt: the application exception's type and message.
    function errorInfo(result) {
      if (!result || typeof result !== 'object') return result ? { message: String(result), type: '' } : null;
      const cause = result.cause && typeof result.cause === 'object' ? result.cause : null;
      return {
        message: result.message || (cause && cause.message) || '',
        type: (cause && cause.type) || simpleClassName(result['@class']) || ''
      };
    }

    function prettyStatus(s) {
      s = String(s || '').replace(/_/g, ' ').toLowerCase();
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function textClassFor(status) {
      const c = statusPillClass(status);
      return { 's-ok': 't-ok', 's-err': 't-err', 's-warn': 't-warn', 's-run': 't-timer', 's-wait': 't-timer', 's-comp': 't-comp' }[c] || 't-wait';
    }

    function relativeTo(t, now) {
      return t >= now ? 'in ' + formatDuration(t - now) : formatDuration(now - t) + ' ago';
    }

    // ---------------------------------------------------------------------------------------------- scale

    // Compressed mode is piecewise linear over every event boundary, each interval's width growing
    // with log(duration) and capped, so a 40ms action and a six-minute wait are both legible on one
    // axis. Linear mode is plain wall-clock proportion. Both return x in [0, 100].
    function makeScale(rows, model) {
      const t0 = model.t0, t1 = model.tEnd;
      if (st.linear) {
        return { x: function(t) { return (t - t0) / (t1 - t0) * 100; }, breaks: [], points: [t0, t1] };
      }
      const set = {};
      [t0, t1, model.terminal ? null : model.now, model.terminal ? null : model.timeout].forEach(function(t) { if (t) set[t] = true; });
      rows.forEach(function(r) {
        (r.bars || []).forEach(function(b) { set[b.s] = true; set[b.e] = true; });
        (r.marks || []).forEach(function(m) { set[m.t] = true; });
      });
      const pts = Object.keys(set).map(Number).filter(function(t) { return t >= t0 && t <= t1; }).sort(function(a, b) { return a - b; });
      if (pts.length < 2) return { x: function(t) { return (t - t0) / (t1 - t0) * 100; }, breaks: [], points: [t0, t1] };
      const w = [], cum = [0], breaks = [];
      for (let i = 1; i < pts.length; i++) {
        const dt = pts[i] - pts[i - 1];
        w.push(Math.min(Math.log1p(dt / 25), 5.2));
        if (dt > IDLE_BREAK_MS) breaks.push([pts[i - 1], pts[i]]);
      }
      const total = w.reduce(function(a, b) { return a + b; }, 0) || 1;
      w.forEach(function(v) { cum.push(cum[cum.length - 1] + v / total); });
      const x = function(t) {
        if (t <= pts[0]) return 0;
        if (t >= pts[pts.length - 1]) return 100;
        let lo = 0, hi = pts.length - 1;
        while (hi - lo > 1) {
          const mid = (lo + hi) >> 1;
          if (pts[mid] <= t) lo = mid; else hi = mid;
        }
        const f = (t - pts[lo]) / ((pts[hi] - pts[lo]) || 1);
        return (cum[lo] + f * (cum[hi] - cum[lo])) * 100;
      };
      return { x: x, breaks: breaks, points: pts };
    }

    // Labels need ~70px each; keep clear of the right edge, where the NOW/TIMEOUT flags usually sit.
    function pickTicks(scale, model) {
      const laneWidth = Math.max($('#tl-body').width() - parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tl-left'), 10), 200);
      const minGap = 70 / laneWidth * 100;
      const cand = st.linear ? niceLinearTicks(model) : scale.points;
      const flagXs = model.terminal ? [] : [model.now, model.timeout].filter(Boolean).map(scale.x);
      const ticks = [];
      let lastX = -100;
      cand.forEach(function(t) {
        const x = scale.x(t);
        const nearFlag = flagXs.some(function(fx) { return Math.abs(fx - x) < minGap; });
        if (x - lastX >= minGap && x <= 100 - minGap && (t === model.t0 || !nearFlag)) { ticks.push(t); lastX = x; }
      });
      return ticks;
    }

    function niceLinearTicks(model) {
      const span = model.tEnd - model.t0;
      const steps = [100, 250, 500, 1e3, 2e3, 5e3, 1e4, 15e3, 3e4, 6e4, 12e4, 3e5, 6e5, 9e5, 18e5, 36e5, 72e5, 216e5, 432e5, 864e5, 1728e5, 6048e5];
      const step = steps.find(function(s) { return span / s <= 8; }) || span / 8;
      const out = [];
      for (let t = model.t0; t <= model.tEnd; t += step) out.push(t);
      return out;
    }

    // ---------------------------------------------------------------------------------------------- render

    function visibleRows() {
      return st.model.rows.filter(function(r) {
        const kind = r.parent ? 'action' : r.kind;
        if (kind !== 'workflow' && st.kinds[kind] === false) return false;
        if (r.parent && st.collapsed[r.parent]) return false;
        return true;
      });
    }

    function render() {
      if (!st || !st.model) return;
      const m = st.model;
      const rows = visibleRows();
      const scale = makeScale(rows, m);
      const X = scale.x;
      const pos = function(s, e) { return 'left:' + X(s).toFixed(3) + '%;width:' + Math.max(X(e) - X(s), 0.2).toFixed(3) + '%'; };
      const ticks = pickTicks(scale, m);
      const showNow = !m.terminal;
      const showTimeout = !m.terminal && m.timeout;

      let grid = ticks.map(function(t) { return '<div class="tick" style="left:' + X(t) + '%"></div>'; }).join('');
      grid += scale.breaks.map(function(b) { return '<div class="brk" style="left:' + ((X(b[0]) + X(b[1])) / 2) + '%" title="' + formatDuration(b[1] - b[0]) + ' compressed"></div>'; }).join('');
      if (showTimeout) grid += '<div class="vline timeout" style="left:' + X(m.timeout) + '%"></div>';
      if (showNow) grid += '<div class="vline now" style="left:' + X(m.now) + '%"></div>';

      let hdrLane = ticks.map(function(t) { return '<div class="ticklab" style="left:' + X(t) + '%">' + (t === m.t0 ? '0' : '+' + formatDuration(t - m.t0)) + '</div>'; }).join('');
      // A flag at the right edge hangs left of its line so it is not clipped.
      // Flags hang left of their line near the right edge. When NOW and TIMEOUT sit close together,
      // NOW moves to the top of the header (tick labels already keep clear of both lines).
      const flag = function(x, top) {
        const t = x > 94 ? 'translateX(-100%)' : x < 4 ? 'none' : '';
        return 'left:' + x + '%' + (t ? ';transform:' + t : '') + (top ? ';top:3px;bottom:auto' : '');
      };
      const close = showNow && showTimeout && Math.abs(X(m.timeout) - X(m.now)) < 10;
      if (showNow) hdrLane += '<div class="vlabel now" style="' + flag(X(m.now), close) + '">NOW</div>';
      if (showTimeout) hdrLane += '<div class="vlabel timeout" style="' + flag(X(m.timeout), false) + '" title="Workflow timeout ' + escapeHtml(formatLocalDate(_currentWorkflow.instance.timeout_time)) + '">TIMEOUT</div>';

      let html = '<div class="tl-grid">' + grid + '</div>';
      html += '<div class="tl-row hdr"><div>Name</div><div>Type</div><div>Status</div><div class="num">Time</div><div class="lane">' + hdrLane + '</div></div>';
      html += overviewRow(m);
      rows.forEach(function(r) { html += rowHtml(r, X, pos); });
      if (rows.length <= 1) html += '<div class="empty">Nothing has run yet.</div>';
      $('#tl-body').html(html);
      $('#tl-scale button').removeClass('on').filter('[data-v="' + (st.linear ? 'linear' : 'compressed') + '"]').addClass('on');
      renderDrawer();
    }

    // Always linear, so the compressed main axis never hides the real proportions.
    function overviewRow(m) {
      const L = function(t) { return ((t - m.t0) / (m.tEnd - m.t0) * 100).toFixed(3); };
      const laneY = { action: 8, attempt: 8, timer: 18, backoff: 18, task: 18, child: 28, signal: 28, workflow: 0 };
      let segs = '';
      m.rows.forEach(function(r) {
        if (r.parent || r.kind === 'workflow') return;
        (r.bars || []).forEach(function(b) {
          if (b.ghost || b.thin) return;
          segs += '<div class="ov-seg ' + b.cls + '" style="left:' + L(b.s) + '%;width:' + Math.max(L(b.e) - L(b.s), 0.3) + '%;top:' + (laneY[r.kind] + 6) + 'px"></div>';
        });
        (r.marks || []).forEach(function(mk) {
          segs += '<div class="ov-seg ' + mk.cls + '" style="left:' + L(mk.t) + '%;width:4px;top:' + (laneY[r.kind] + 6) + 'px"></div>';
        });
      });
      if (!m.terminal) segs += '<div class="vline now" style="left:' + L(m.now) + '%"></div>';
      if (!m.terminal && m.timeout) segs += '<div class="vline timeout" style="left:' + L(m.timeout) + '%"></div>';
      return '<div class="tl-row ov"><div class="muted" style="font-size:11.5px">Overview · linear, ' + formatDuration(m.tEnd - m.t0) + '</div><div></div><div></div><div></div><div class="lane">' + segs + '</div></div>';
    }

    function rowHtml(r, X, pos) {
      let name;
      if (r.parent) {
        name = '<span class="tl-name"><span class="faint">└</span>' + escapeHtml(r.label) + '</span>';
      } else {
        const caret = r.expandable ? '<span class="tw" data-toggle="' + escapeHtml(r.id) + '">' + (st.collapsed[r.id] ? '▸' : '▾') + '</span>' : '<span class="tw"></span>';
        name = '<span class="tl-name" title="' + escapeHtml(r.label) + '">' + caret + '<span class="ic ' + r.iconCls + '">' + r.icon + '</span><code>' + escapeHtml(r.label) + (r.linkOut ? ' ↗' : '') + '</code>' +
          (r.sub ? '<span class="it">' + escapeHtml(r.sub) + '</span>' : '') +
          (r.tagText ? '<span class="tag">' + escapeHtml(r.tagText) + '</span>' : '') + '</span>';
      }
      let lane = '';
      (r.bars || []).forEach(function(b) {
        const cls = ['bar', b.cls, b.hatch ? 'hatch' : '', b.ghost ? 'ghost' : '', b.thin ? 'thin' : ''].join(' ');
        lane += '<div class="' + cls + '" style="' + pos(b.s, b.e) + '"></div>';
        if (b.label) lane += barLabel(b.label, X(b.s), X(b.e));
      });
      (r.marks || []).forEach(function(mk) {
        lane += '<div class="diamond ' + mk.cls + '" style="left:' + X(mk.t) + '%"></div>';
        if (mk.label) lane += barLabel(mk.label, X(mk.t) - 1, X(mk.t) + 1);
      });
      const selected = st.selected === r.id;
      return '<div class="tl-row' + (r.parent ? ' sub' : '') + (selected ? ' sel' : '') + '" data-row="' + escapeHtml(r.id) + '">' +
        '<div>' + name + '</div><div class="muted">' + escapeHtml(r.typeLabel) + '</div>' +
        '<div class="st ' + r.statusCls + '">' + escapeHtml(r.status) + '</div><div class="num">' + escapeHtml(r.durText) + '</div>' +
        '<div class="lane">' + lane + '</div></div>';
    }

    // Labels sit right of the bar, or left of it when the bar ends near the right edge.
    function barLabel(text, x0, x1) {
      const t = escapeHtml(String(text).length > 60 ? String(text).slice(0, 57) + '…' : text);
      return x1 > 68 && x0 > 35
        ? '<div class="blabel before" style="left:calc(' + x0 + '% - 6px)">' + t + '</div>'
        : '<div class="blabel" style="left:calc(' + x1 + '% + 6px)">' + t + '</div>';
    }

    $(document).on('click', '#tl-body [data-toggle]', function(e) {
      e.stopPropagation();
      const id = String($(this).data('toggle'));
      st.collapsed[id] = !st.collapsed[id];
      render();
    });
    $(document).on('click', '#tl-body .tl-row[data-row]', function() {
      st.selected = String($(this).data('row'));
      render();
      const r = rowById(st.selected);
      if (r && r.checkpoint && !r.checkpoint.isSuccessful && r.checkpoint.execution_end_time) {
        showError(r.groupId, rowById(r.groupId).attempts.indexOf(r.checkpoint));
      }
    });

    // ---------------------------------------------------------------------------------------------- drawer

    function renderDrawer() {
      const r = st.selected ? rowById(st.selected) : null;
      if (!r) { $('#tl-drawer').html('<div class="dr-b muted">Select a row to see its details.</div>'); return; }
      const group = r.groupId ? rowById(r.groupId) : null;
      let html;
      if (r.kind === 'action') html = actionDrawer(r, null);
      else if (group) html = actionDrawer(group, r);
      else if (r.kind === 'timer') html = timerDrawer(r);
      else if (r.kind === 'signal') html = signalDrawer(r);
      else if (r.kind === 'child') html = childDrawer(r);
      else if (r.kind === 'task') html = taskDrawer(r);
      else html = workflowDrawer(r);
      $('#tl-drawer').html(html);
    }

    function head(title, sub, statusLine) {
      return '<div class="dr-h"><div class="t">' + escapeHtml(title) + (sub ? ' <span class="faint">' + escapeHtml(sub) + '</span>' : '') + '</div>' +
        '<div class="s">' + statusLine + '</div></div>';
    }

    function kv(pairs) {
      return '<div class="kv">' + pairs.filter(function(p) { return p[1] !== null && p[1] !== undefined && p[1] !== ''; }).map(function(p) {
        return '<div class="k">' + escapeHtml(p[0]) + '</div><div class="v' + (p[2] ? ' mono' : '') + '">' + p[1] + '</div>';
      }).join('') + '</div>';
    }

    function at(t) {
      return t === null || t === undefined ? '' : escapeHtml(new Date(t).toLocaleTimeString('en-US', { hour12: false }) + '.' + String(t % 1000).padStart(3, '0')) +
        ' <span class="faint">(+' + escapeHtml(formatDuration(t - st.model.t0)) + ')</span>';
    }

    function actionDrawer(g, focus) {
      const last = g.attempts[g.attempts.length - 1];
      const n = g.attempts.length;
      const statusText = {
        't-ok': n > 1 ? 'Succeeded on attempt ' + n : 'Succeeded',
        't-err': g.status === 'Exhausted' ? 'Retries exhausted after ' + n + ' attempt' + (n > 1 ? 's' : '') : 'Failed',
        't-warn': g.nextAttempt ? 'Retrying · next attempt ' + relativeTo(g.nextAttempt, st.model.now) : 'Transient failure',
        't-timer': 'Running'
      }[g.statusCls] || g.status;
      let html = head(g.label, g.sub, '<span class="' + g.statusCls + '">● ' + escapeHtml(statusText) + '</span> · ' + escapeHtml(g.durText.replace('…', '')) + ' total');
      html += '<div class="dr-b">';
      if (g.steps.length > 1) {
        const s0 = g.steps[0].s, span = Math.max(g.steps[g.steps.length - 1].e - s0, 1);
        html += '<div class="dr-sec">Timing</div>';
        g.steps.forEach(function(step) {
          html += '<div class="tline"><span' + (step.pending ? ' class="muted"' : '') + '>' + escapeHtml(step.label) + '</span><div class="track"><b class="' + step.cls + (step.backoff ? ' hatch-swatch' : '') +
            '" style="left:' + ((step.s - s0) / span * 100) + '%;width:' + Math.max((step.e - step.s) / span * 100, 1.5) + '%"></b></div><span class="d">' +
            escapeHtml(formatDuration(step.e - step.s)) + (step.running ? '…' : '') + '</span></div>';
        });
        const exec = g.steps.filter(function(s) { return !s.backoff; }).reduce(function(a, s) { return a + (s.e - s.s); }, 0);
        const wait = g.steps.filter(function(s) { return s.backoff; }).reduce(function(a, s) { return a + (s.e - s.s); }, 0);
        html += '<div class="sum"><span>Executing <b>' + formatDuration(exec) + '</b></span><span>Backing off <b>' + formatDuration(wait) + '</b></span><span>Total <b>' + formatDuration(exec + wait) + '</b></span></div>';
      }
      // One line per failed attempt; the full error and stack trace open in a modal, so a long trace
      // never stretches the drawer (and with it the whole timeline card).
      const failures = failedAttempts(g);
      if (failures.length) {
        html += '<div class="dr-sec">Errors (' + failures.length + ')</div><div class="err-list">';
        failures.forEach(function(i) {
          const cp = g.attempts[i];
          const err = errorInfo(cp.result) || { message: '', type: '' };
          const focused = focus && focus.checkpoint === cp;
          html += '<button class="err-row' + (focused ? ' on' : '') + '" data-err-group="' + escapeHtml(g.id) + '" data-err-index="' + i + '">' +
            '<span class="h">Attempt ' + (i + 1) + ' · ' + (cp.transient ? 'transient' : 'non-retryable') + (err.type ? ' · ' + escapeHtml(simpleClassName(err.type)) : '') + '</span>' +
            '<span class="m">' + escapeHtml(err.message) + '</span><span class="go">›</span></button>';
        });
        html += '</div>';
      }
      const focusCp = focus && focus.checkpoint ? focus.checkpoint : last;
      html += '<div class="dr-sec">Details</div>' + kv([
        ['Action', escapeHtml(simpleClassName(g.tag.action_class) + '.' + g.tag.action_method), true],
        ['Iteration', escapeHtml(g.tag.iteration), true],
        ['Checkpoint', g.tag.checkpoint_name ? escapeHtml(g.tag.checkpoint_name) : null, true],
        ['Started', at(g.start), true],
        ['Finished', toMillis(last.execution_end_time) ? at(toMillis(last.execution_end_time)) : '<span class="muted">—</span>', true]
      ]);
      html += '<div class="dr-actions">';
      if (focusCp.isSuccessful && focusCp.result !== null && focusCp.result !== undefined) {
        html += '<button class="btn" onclick="Timeline.viewResult()">View result</button>';
      }
      html += '<button class="btn" onclick="Timeline.rewind()">⏮ Rewind to here</button></div></div>';
      return html;
    }

    function timerDrawer(r) {
      const t = r.source;
      let html = head(r.label, '', '<span class="' + r.statusCls + '">● ' + escapeHtml(r.status) + '</span>');
      html += '<div class="dr-b">' + kv([
        ['Created', at(toMillis(t.created_at)), true],
        ['Duration', escapeHtml(formatDuration(parseIsoDuration(t.duration)) || t.duration), true],
        ['Expires', at(toMillis(t.expires_at)), true],
        ['Status', escapeHtml(t.status)]
      ]);
      if (r.note) html += '<p class="muted" style="font-size:12px;margin:12px 0 0">' + escapeHtml(r.note) + ' Timers do not record when they were cancelled.</p>';
      return html + '</div>';
    }

    function signalDrawer(r) {
      const s = r.source;
      let html = head(r.label, '#' + s.id, '<span class="' + r.statusCls + '">● ' + escapeHtml(r.status) + '</span>');
      html += '<div class="dr-b">' + kv([
        ['Received', at(toMillis(s.created_at)), true],
        ['Updated', at(toMillis(s.updated_at)), true],
        ['Input', s.input !== null && s.input !== undefined ? '<code>' + escapeHtml(String(typeof s.input === 'string' ? s.input : JSON.stringify(s.input)).slice(0, 160)) + '</code>' : null]
      ]);
      if (s.error) html += '<div class="err-box"><div class="h">Error</div>' + escapeHtml(String(s.error).split('\n')[0]) + '</div>';
      html += '<div class="dr-actions">';
      if (s.input !== null && s.input !== undefined) html += '<button class="btn" onclick="viewSignalInput(' + r.signalIndex + ')">View input</button>';
      if (s.error) html += '<button class="btn" onclick="viewSignalError(' + r.signalIndex + ')">View error</button>';
      return html + '<button class="btn" onclick="replaySignalByIndex(' + r.signalIndex + ')">Replay</button></div></div>';
    }

    function childDrawer(r) {
      const wf = r.source;
      let html = head(r.label, '', statusPill(wf.status));
      html += '<div class="dr-b">' + kv([
        ['Workflow ID', '<a href="#workflow/' + encodeURIComponent(wf.workflow_id) + '">' + escapeHtml(wf.workflow_id) + '</a>', true],
        ['Started', at(r.start), true],
        ['Ended', isTerminal(wf.status) ? at(r.end) : '<span class="muted">— not finished</span>', true],
        ['Duration', escapeHtml(r.durText), true]
      ]);
      return html + '<div class="dr-actions"><a class="btn" href="#workflow/' + encodeURIComponent(wf.workflow_id) + '">Open child workflow ↗</a></div></div>';
    }

    function taskDrawer(r) {
      const t = r.source;
      let html = head(r.label, '', statusPill(t.status));
      html += '<div class="dr-b">' + kv([
        ['Task ID', escapeHtml(t.id), true],
        ['Created', at(toMillis(t.created_at)), true],
        ['Run after', at(toMillis(t.run_after)), true],
        ['Retries', escapeHtml(t.retry_count), true],
        ['Message', t.status_message ? escapeHtml(t.status_message) : null]
      ]);
      return html + '</div>';
    }

    function workflowDrawer(r) {
      const inst = st.data.instance;
      const actions = st.model.rows.filter(function(x) { return x.kind === 'action'; });
      const attempts = actions.reduce(function(a, x) { return a + x.attempts.length; }, 0);
      let html = head(simpleClassName(inst.workflow_class) + '.' + inst.workflow_method, '', statusPill(inst.status));
      html += '<div class="dr-b">' + kv([
        ['Started', at(r.start), true],
        ['Ended', st.model.terminal ? at(r.end) : '<span class="muted">— not finished</span>', true],
        ['Timeout', st.model.timeout ? at(st.model.timeout) : null, true],
        ['Actions', actions.length + ' · ' + attempts + ' attempt' + (attempts === 1 ? '' : 's'), true]
      ]);
      return html + '</div>';
    }

    function selectedCheckpoint() {
      const r = rowById(st.selected);
      if (!r) return null;
      if (r.checkpoint) return { cp: r.checkpoint, group: rowById(r.groupId) };
      const g = r.kind === 'action' ? r : r.groupId ? rowById(r.groupId) : null;
      return g ? { cp: g.attempts[g.attempts.length - 1], group: g } : null;
    }

    function viewResult() {
      const sel = selectedCheckpoint();
      if (sel) show_data('Action result', JSON.stringify(sel.cp.result));
    }

    function failedAttempts(g) {
      const out = [];
      g.attempts.forEach(function(cp, i) { if (!cp.isSuccessful && cp.execution_end_time) out.push(i); });
      return out;
    }

    // A serialized Throwable as Skipper's JSON carries it: {type | @class, message, stackTrace, cause}.
    function throwableChain(node) {
      const chain = [];
      const seen = [];
      while (node && typeof node === 'object' && seen.indexOf(node) === -1 && chain.length < 10) {
        seen.push(node);
        chain.push(node);
        node = node.cause;
      }
      return chain;
    }

    function frameText(f) {
      const where = f.nativeMethod ? 'Native Method' : f.fileName ? f.fileName + (f.lineNumber >= 0 ? ':' + f.lineNumber : '') : 'Unknown Source';
      return 'at ' + (f.className || '?') + '.' + (f.methodName || '?') + '(' + where + ')';
    }

    function isLibraryFrame(f) {
      const c = String(f.className || '');
      return /^(java|javax|jdk|sun|kotlin|kotlinx|com\.airbnb\.skipper)\./.test(c) || c.indexOf('_$$_') !== -1;
    }

    function retryStrategyText(rs) {
      if (!rs || typeof rs !== 'object') return '';
      const parts = Object.keys(rs).filter(function(k) { return k !== '@class'; }).map(function(k) {
        const v = rs[k];
        return k + ' ' + (typeof v === 'number' && /delay/i.test(k) ? formatDuration(v * 1000) : v);
      });
      return simpleClassName(rs['@class'] || 'RetryStrategy') + (parts.length ? ' · ' + parts.join(' · ') : '');
    }

    // The full error of one attempt, with the cause chain and every frame; prev/next step between failed attempts.
    function showError(groupId, index) {
      const g = rowById(groupId);
      if (!g) return;
      const cp = g.attempts[index];
      const failures = failedAttempts(g);
      const pos = failures.indexOf(index);
      const result = cp.result;
      const chain = throwableChain(result);
      const s = toMillis(cp.execution_start_time), e = toMillis(cp.execution_end_time);
      let text = '', html = '';
      chain.forEach(function(node, depth) {
        const head = (depth ? 'Caused by: ' : '') + (node.type || node['@class'] || 'Error') + (node.message ? ': ' + node.message : '');
        text += head + '\n';
        html += '<span class="hd">' + escapeHtml(head) + '</span>\n';
        (node.stackTrace || []).forEach(function(f) {
          text += '    ' + frameText(f) + '\n';
          html += '<span class="fr' + (isLibraryFrame(f) ? ' lib' : '') + '">    ' + escapeHtml(frameText(f)) + '</span>\n';
        });
      });
      if (!chain.length) {
        text = typeof result === 'string' ? result : JSON.stringify(result, null, 2);
        html = escapeHtml(text);
      }
      const root = chain[chain.length - 1] || {};
      const body = kv([
        ['Action', escapeHtml(g.label) + ' <span class="faint">' + escapeHtml(g.sub || '') + '</span>', true],
        ['Attempt', (index + 1) + ' of ' + g.attempts.length + ' · ' + (cp.transient ? 'transient (retryable)' : 'non-retryable')],
        ['Started', at(s), true],
        ['Ran for', escapeHtml(formatDuration(e - s)), true],
        ['Retry strategy', result && result.retryStrategy ? escapeHtml(retryStrategyText(result.retryStrategy)) : null, true]
      ]) +
        '<div class="err-sum"><div class="h">' + escapeHtml(root.type || root['@class'] || 'Error') + '</div>' + escapeHtml(root.message || (chain[0] && chain[0].message) || '') + '</div>' +
        '<div class="dr-sec">Stack trace <span class="faint" style="text-transform:none;letter-spacing:0">· Skipper and JDK frames dimmed</span></div>' +
        '<pre class="trace">' + html + '</pre>';
      const btn = function(i, label, raw) {
        return '<button class="btn" data-err-group="' + escapeHtml(groupId) + '" data-err-index="' + i + '"' + (raw ? ' data-err-raw="1"' : '') + '>' + label + '</button>';
      };
      const nav = (pos > 0 ? btn(failures[pos - 1], '← Attempt ' + (failures[pos - 1] + 1)) : '') +
        (pos < failures.length - 1 ? btn(failures[pos + 1], 'Attempt ' + (failures[pos + 1] + 1) + ' →') : '') +
        btn(index, 'Raw JSON', true);
      showModal('Attempt ' + (index + 1) + ' error · ' + g.label, body, text, nav, true);
    }

    // Error buttons carry the group id and attempt index as data attributes rather than in an inline
    // handler, so a crafted action or checkpoint name cannot break out of the markup.
    $(document).on('click', '[data-err-group]', function() {
      const groupId = String($(this).attr('data-err-group'));
      const index = parseInt($(this).attr('data-err-index'), 10);
      if ($(this).attr('data-err-raw')) {
        const g = rowById(groupId);
        if (g) show_data('Attempt ' + (index + 1) + ' error (raw JSON)', JSON.stringify(g.attempts[index].result));
      } else {
        showError(groupId, index);
      }
    });

    function rewind() {
      const sel = selectedCheckpoint();
      if (!sel) return;
      const tag = sel.group.tag;
      rewindToCheckpoint(tag.workflow_id, tag.action_class, tag.action_method, tag.iteration, tag.checkpoint_name);
    }

    $(window).on('resize', function() { if (st && $('#tl-body').length) render(); });

    return { init: init, setSignals: setSignals, setChildren: setChildren, viewResult: viewResult, rewind: rewind };
  })();

  // ===================================================================================================================
  // Row actions
  // ===================================================================================================================

  function dequeueTask(taskId) {

  function cancelWorkflowFromTask(taskId) {

      alert('Failed to cancel workflow: ' + response.responseText);
    });
  }

  function requeueTask(taskId) {
    if (!confirm('Are you sure you want to requeue this task?')) {
      return;

    $.post('/skipper/admin/scheduler/' + encodeURIComponent(taskId) + '/requeue', function() {

  // Task actions are offered on both the DLQ and a workflow's Scheduled tasks tab; refresh whichever is showing.
  function refreshAfterAction() {

    }).fail(function(response) {

  function resetWorkflowFromError(workflowId) {
    if (!confirm('Are you sure you want to reset this workflow from ERROR to RUNNING?\n\nThis will:\n- Change the workflow status from ERROR to RUNNING\n- Delete the latest non-transient error checkpoint\n- Schedule the workflow for immediate execution\n\nThis operation cannot be undone.')) {

  function deleteWorkflow(workflowId) {
    if (!confirm('WARNING: You are about to permanently delete this workflow.\n\n' +

        'Are you sure you want to proceed?')) {

    }

  // ===================================================================================================================
  // List views
  // ===================================================================================================================

  // Navigation sets the hash and lets route() (the hashchange listener) load the view, so a view is
  // fetched exactly once per navigation. When the hash is already the target no hashchange fires,
  // so the view is (re)loaded directly - which is also what the post-action refreshes rely on.
  function navigateTo(hash, load) {
    if (window.location.hash.substring(1) === hash) {
      load();
    } else {
      window.location.hash = hash;
    }
  }

  function showHome() {
    navigateTo('', loadHome);
  }

  function loadHome() {
    setChrome('home', '<b>Overview</b>');
    const render = function(stats) {
      $('#main_content').html(home_view({ stats: stats }));
      safeGet('/skipper/admin/workflows?limit=10', function(result) {
        const wfs = result.workflows || [];
        $('#recent-workflows').html(wfs.length === 0 ? '<div class="empty">No workflows yet.</div>'
          : '<table class="tbl"><thead><tr><th>Workflow ID</th><th>Entry point</th><th>Status</th><th>Created</th><th>Updated</th><th class="r">Duration</th></tr></thead><tbody>' +
            wfs.map(function(wf) { return workflow_row_partial(wf); }).join('') + '</tbody></table>');
      }, function() {
        $('#recent-workflows').html('<div class="empty">Failed to load workflows.</div>');
      });
    };
    safeGet('/skipper/admin/dashboard/stats', render, function() {
      // Show basic home view even if stats fail
      render({ exhausted_retries_count: 0, dlq_tasks_count: 0, scheduler_backlog_count: 0 });
    });
  }

  // Bulk-selection bar shared by the exhausted-retries and DLQ tables.
  function updateSelection(checkboxSelector) {
    const all = $(checkboxSelector + ':visible');
    const n = $(checkboxSelector + ':checked').length;
    $('#selbar').toggleClass('active', n > 0);
    $('#selbar-count').text(n > 0 ? n + ' selected' : (checkboxSelector === '.task-checkbox' ? 'Select tasks to act on them' : 'Select workflows to act on them'));
    $('#selbar .sel-action').prop('disabled', n === 0);
    $('#select-all-workflows, #select-all-tasks').prop('checked', n > 0 && n === all.length);
    $(checkboxSelector).each(function() { $(this).closest('tr').toggleClass('sel-row', this.checked); });
  }

  // Backs the sortable "Updated" column header. Sorting is opt-in — and only two-state rather than the
  // usual asc/desc cycle — because the server-side sort is not index-backed and times out once the
  // backlog is large, so the unsorted (index-order) listing is the default. Held in a module-level var
  // so re-renders (e.g. after a bulk action) keep the operator's choice.
  var _exhaustedRetriesOrderByUpdatedAt = false;

  function toggleExhaustedRetriesOrdering() {
    _exhaustedRetriesOrderByUpdatedAt = !_exhaustedRetriesOrderByUpdatedAt;
    loadExhaustedRetries();
  }

  function showExhaustedRetries() {
    navigateTo('exhausted-retries', loadExhaustedRetries);
  }

  function loadExhaustedRetries() {
    setChrome('exhausted-retries', 'Needs attention / <b>Exhausted retries</b>');
    // Omitting sortBy entirely is what asks the server for the unsorted (fast) listing.
    const url = '/skipper/admin/workflows/exhausted-retries' +
      (_exhaustedRetriesOrderByUpdatedAt ? '?sortBy=UPDATED_AT&sortDirection=ASC' : '');
    safeGet(url, function(response) {
      $('#main_content').html(exhausted_retries_view(
        Object.assign({}, response, { order_by_updated_at: _exhaustedRetriesOrderByUpdatedAt })));
      refreshNavCounts();
    }, function(response) {
      alert('Failed to load exhausted retries: ' + response.responseText);
    });
  }

  function showDLQ() {
    navigateTo('dlq', loadDLQ);
  }

  function loadDLQ() {
    setChrome('dlq', 'Needs attention / <b>Dead letter queue</b>');
    safeGet('/skipper/admin/scheduler/dlq', function(response) {
      const counts = {};
      (response.tasks || []).forEach(function(t) { counts[t.type] = (counts[t.type] || 0) + 1; });
      response.type_counts = Object.keys(counts).sort().map(function(k) { return { type: k, count: counts[k] }; });
      $('#main_content').html(dlq_view(response));
      // Type chips filter the rendered rows; a hidden row is also deselected so bulk actions only see what is shown.
      $('#dlq-types').on('click', '[data-type]', function() {
        const type = String($(this).data('type'));
        $('#dlq-types .chip').removeClass('on');
        $(this).addClass('on');
        $('#main_content tr[data-type]').each(function() {
          const show = !type || $(this).data('type') === type;
          $(this).toggle(show);
          if (!show) $(this).find('.task-checkbox').prop('checked', false);
        });
        updateSelection('.task-checkbox');
      });
      refreshNavCounts();
    }, function(response) {
      alert('Failed to load DLQ: ' + response.responseText);
    });
  }

  function showCluster() {
    navigateTo('cluster', loadCluster);
  }

  // Colors cycle per member so adjacent bucket ranges stay distinguishable in the assignment bar.
  const CLUSTER_MEMBER_COLORS = ['#4c8dff', '#39c5cf', '#3fb950', '#bc8cff', '#d29922', '#f0883e', '#f778ba', '#8b95a5'];

  function loadCluster() {
    setChrome('cluster', 'System / <b>Cluster</b>');
    safeGet('/skipper/admin/cluster', function(response) {
      (response.members || []).forEach(function(m, i) {
        m.share = response.total_buckets > 0 ? (100 * m.bucket_count / response.total_buckets).toFixed(1) : '0.0';
        m.color = CLUSTER_MEMBER_COLORS[i % CLUSTER_MEMBER_COLORS.length];
      });
      response.loaded_at = new Date().toLocaleTimeString('en-US', { hour12: false });
      $('#main_content').html(cluster_view(response, {
        helpers: { quarter: function(q) { return Math.round(response.total_buckets * q / 4); } }
      }));
      $('#nav-cluster').text((response.members || []).length === 1 ? '1 node' : (response.members || []).length + ' nodes');
    }, function(response) {
      alert('Failed to load cluster: ' + response.responseText);
    });
  }

  // Stored globally so re-renders preserve the dropdown and accumulated results
  var _workflowTypes = [];
  var _workflowResults = [];
  var _workflowNextCursor = null;
  var _workflowLoadingMore = false;
  var _workflowSavedFilters = null;

  // One-click status presets; each sets the Status filter and searches.
  const QUICK_FILTERS = [
    { label: 'All', statuses: [] },
    { label: 'Running', statuses: ['RUNNING'] },
    { label: 'Waiting', statuses: ['WAITING'] },
    { label: 'Failed', statuses: ['ERROR', 'TRANSIENT_ERROR', 'TIMEOUT'] },
    { label: 'Retries exhausted', statuses: ['RETRIES_EXHAUSTED'] },
    { label: 'Compensating', statuses: ['COMPENSATION_IN_PROGRESS', 'COMPENSATION_ERROR'] },
    { label: 'Completed', statuses: ['COMPLETED', 'COMPENSATION_COMPLETED'] },
    { label: 'Cancelled', statuses: ['CANCELLED'] }
  ];

  function showWorkflows() {
    navigateTo('workflows', loadWorkflows);
  }

  function loadWorkflows() {
    setChrome('workflows', '<b>Workflows</b>');
    // Render the form immediately (empty results) while we fetch types + data
    _workflowResults = [];
    _workflowNextCursor = null;
    _workflowSavedFilters = null;
    renderWorkflowsViewFull(true);
    safeGet('/skipper/admin/workflow-types', function(types) {
      _workflowTypes = types;
      renderWorkflowsViewFull(true);
      executeWorkflowSearch();
    }, function() {
      _workflowTypes = [];
      renderWorkflowsViewFull(true);
      executeWorkflowSearch();
    });
  }

  function renderWorkflowsViewFull(loading) {
    const data = {
      workflowTypes: _workflowTypes,
      statuses: ALL_STATUSES,
      quickFilters: QUICK_FILTERS,
      loading: !!loading,
      result: _workflowResults.length > 0 ? { workflows: _workflowResults, next_cursor: _workflowNextCursor } : null,
      hasNext: !!_workflowNextCursor
    };
    $('#main_content').html(workflows_list_view(data));
    restoreFilters();
    setupCheckboxDropdowns();
    setupInfiniteScroll();
  }

  function appendWorkflowRows(newWorkflows) {
    let html = '';
    newWorkflows.forEach(function(wf) {
      html += workflow_row_partial(wf);
    });
    $('#workflows-tbody').append(html);
    $('#result-count').text('Showing ' + _workflowResults.length + ' workflows');
    if (_workflowNextCursor) {
      $('#scroll-hint').show();
    } else {
      $('#scroll-hint').hide();
    }
  }

  function restoreFilters() {
    if (_workflowSavedFilters) {
      (_workflowSavedFilters.entryPoints || []).forEach(function(ep) {
        $('.filter-type-cb').filter(function() { return this.value === ep; }).prop('checked', true);
      });
      (_workflowSavedFilters.statuses || []).forEach(function(s) {
        $('.filter-status-cb[value="' + s + '"]').prop('checked', true);
      });
      if (_workflowSavedFilters.after) $('#filter-created-after').val(_workflowSavedFilters.after);
      if (_workflowSavedFilters.before) $('#filter-created-before').val(_workflowSavedFilters.before);
      if (_workflowSavedFilters.parent) $('#filter-parent').val(_workflowSavedFilters.parent);
    }
    updateDropdownLabels();
  }

  function setupCheckboxDropdowns() {
    $(document).off('change.filterType').on('change.filterType', '.filter-type-cb', updateDropdownLabels);
    $(document).off('change.filterStatus').on('change.filterStatus', '.filter-status-cb', updateDropdownLabels);
  }

  function updateDropdownLabels() {
    const types = $('.filter-type-cb:checked');
    $('#type-dropdown-btn').text(types.length === 0 ? 'All entry points'
      : types.length === 1 ? simpleClassName(types.val().split('::')[0]) + '.' + types.val().split('::')[1] : types.length + ' entry points');
    const statuses = $('.filter-status-cb:checked').map(function() { return this.value; }).get();
    $('#status-dropdown-btn').text(statuses.length === 0 ? 'Any status' : statuses.length === 1 ? statuses[0].replace(/_/g, ' ') : statuses.length + ' statuses');
    // Highlight the quick filter that matches the selected statuses exactly, if any.
    const key = statuses.slice().sort().join(',');
    $('#status-quick .chip').removeClass('on').filter(function() {
      return QUICK_FILTERS[$(this).data('quick')].statuses.slice().sort().join(',') === key;
    }).addClass('on');
  }

  function applyQuickFilter(i) {
    const statuses = QUICK_FILTERS[i].statuses;
    $('.filter-status-cb').each(function() { this.checked = statuses.indexOf(this.value) !== -1; });
    updateDropdownLabels();
    executeWorkflowSearch();
  }

  function getCurrentFilters() {
    const entryPoints = [];
    $('.filter-type-cb:checked').each(function() { entryPoints.push($(this).val()); });
    const statuses = [];
    $('.filter-status-cb:checked').each(function() { statuses.push($(this).val()); });
    return {
      entryPoints: entryPoints,
      statuses: statuses,
      after: $('#filter-created-after').val() || '',
      before: $('#filter-created-before').val() || '',
      parent: $.trim($('#filter-parent').val() || '')
    };
  }

  function buildWorkflowSearchUrl(filters, cursor) {
    const params = [];
    if (filters.entryPoints && filters.entryPoints.length > 0) {
      filters.entryPoints.forEach(function(ep) {
        params.push('entryPoint=' + encodeURIComponent(ep));
      });
    }
    if (filters.statuses && filters.statuses.length > 0) {
      filters.statuses.forEach(function(s) {
        params.push('status=' + encodeURIComponent(s));
      });
    }
    if (filters.after) params.push('createdAfter=' + encodeURIComponent(new Date(filters.after).toISOString()));
    if (filters.before) params.push('createdBefore=' + encodeURIComponent(new Date(filters.before + 'T23:59:59Z').toISOString()));
    if (filters.parent) params.push('parentWorkflowId=' + encodeURIComponent(filters.parent));
    if (cursor) params.push('cursor=' + encodeURIComponent(cursor));
    return '/skipper/admin/workflows' + (params.length > 0 ? '?' + params.join('&') : '');
  }

  function executeWorkflowSearch(cursor) {
    const filters = getCurrentFilters();
    closeDropdowns(null);
    if (!cursor) {
      _workflowResults = [];
      _workflowNextCursor = null;
    }
    _workflowSavedFilters = filters;
    _workflowLoadingMore = true;

    safeGet(buildWorkflowSearchUrl(filters, cursor), function(result) {
      _workflowLoadingMore = false;
      _workflowResults = _workflowResults.concat(result.workflows);
      _workflowNextCursor = result.next_cursor;
      if (!cursor) {
        renderWorkflowsViewFull(false);
      } else {
        appendWorkflowRows(result.workflows);
      }
    }, function(response) {
      _workflowLoadingMore = false;
      alert('Search failed: ' + (response.responseText || 'Unknown error'));
    });
  }

  function setupInfiniteScroll() {
    $(window).off('scroll.workflows').on('scroll.workflows', function() {
      if (_workflowLoadingMore || !_workflowNextCursor) return;
      if (window.location.hash !== '#workflows') {
        $(window).off('scroll.workflows');
        return;
      }
      const scrollBottom = $(window).scrollTop() + $(window).height();
      const docHeight = $(document).height();
      if (scrollBottom >= docHeight - 200) {
        executeWorkflowSearch(_workflowNextCursor);
      }
    });
  }

  function retryWorkflow(workflowId) {
    if (!confirm('Are you sure you want to retry this workflow?')) {
      return;
    }
    $.ajax({
      url: '/skipper/admin/workflows/bulk-retry',
      type: 'POST',
      data: JSON.stringify([workflowId]),
      contentType: 'application/json',
      dataType: 'json'
    }).done(function(response) {
      if (response.failed.length > 0) {
        alert('Failed to retry workflow: ' + workflowId);
      } else {
        showExhaustedRetries();
      }
    }).fail(function(response) {
      alert('Failed to retry workflow: ' + response.responseText);
    });
  }

  // Same re-execute as retryWorkflow() but invoked from the workflow detail view, so it refreshes
  // the current instance instead of navigating back to the exhausted-retries list.
  function retryWorkflowDetail(workflowId) {
    if (!confirm('Retry (re-execute) this workflow? It will be rescheduled for execution.')) {
      return;
    }
    $.ajax({
      url: '/skipper/admin/workflows/bulk-retry',
      type: 'POST',
      data: JSON.stringify([workflowId]),
      contentType: 'application/json',
      dataType: 'json'
    }).done(function(response) {
      if (response.failed && response.failed.length > 0) {
        alert('Failed to retry workflow: ' + workflowId);
      } else {
        location.reload();
      }
    }).fail(function(response) {
      alert('Failed to retry workflow: ' + response.responseText);
    });
  }

  function toggleAllWorkflows() {
    const checked = document.getElementById('select-all-workflows').checked;
    $('.workflow-checkbox:visible').prop('checked', checked);
    updateSelection('.workflow-checkbox');
  }

  function toggleAllTasks() {
    const checked = document.getElementById('select-all-tasks').checked;
    $('.task-checkbox:visible').prop('checked', checked);
    updateSelection('.task-checkbox');
  }

  function getSelectedWorkflows() {
    const checkboxes = document.querySelectorAll('.workflow-checkbox:checked');
    return Array.from(checkboxes).map(checkbox => checkbox.value);
  }

  function getSelectedTasks() {
    const checkboxes = document.querySelectorAll('.task-checkbox:checked');
    return Array.from(checkboxes).map(checkbox => checkbox.value);
  }

  function bulkCancelWorkflows() {
    const selected = getSelectedWorkflows();
    if (selected.length === 0) {
      alert('Please select at least one workflow to cancel.');
      return;
    }
    if (!confirm('Are you sure you want to cancel ' + selected.length + ' workflow(s)?')) {
      return;
    }
    $.ajax({
      url: '/skipper/admin/workflows/bulk-cancel',
      type: 'POST',
      data: JSON.stringify(selected),
      contentType: 'application/json',
      dataType: 'json'
    }).done(function(response) {
      alert('Successfully cancelled ' + response.successful.length + ' workflow(s). Failed: ' + response.failed.length);
      showExhaustedRetries();
    }).fail(function(response) {
      alert('Failed to cancel workflows: ' + response.responseText);
    });
  }

  function bulkRetryWorkflows() {
    const selected = getSelectedWorkflows();
    if (selected.length === 0) {
      alert('Please select at least one workflow to retry.');
      return;
    }
    if (!confirm('Are you sure you want to retry ' + selected.length + ' workflow(s)?')) {
      return;
    }
    $.ajax({
      url: '/skipper/admin/workflows/bulk-retry',
      type: 'POST',
      data: JSON.stringify(selected),
      contentType: 'application/json',
      dataType: 'json'
    }).done(function(response) {
      alert('Successfully retried ' + response.successful.length + ' workflow(s). Failed: ' + response.failed.length);
      showExhaustedRetries();
    }).fail(function(response) {
      alert('Failed to retry workflows: ' + response.responseText);
    });
  }

  function bulkRedriveTasks() {
    const selected = getSelectedTasks();
    if (selected.length === 0) {
      alert('Please select at least one task to redrive.');
      return;
    }
    if (!confirm('Are you sure you want to redrive ' + selected.length + ' task(s)?')) {
      return;
    }
    $.ajax({
      url: '/skipper/admin/scheduler/bulk-redrive',
      type: 'POST',
      data: JSON.stringify(selected),
      contentType: 'application/json',
      dataType: 'json'
    }).done(function(response) {
      alert('Successfully redriven ' + response.successful.length + ' task(s). Failed: ' + response.failed.length);
      showDLQ();
    }).fail(function(response) {
      alert('Failed to redrive tasks: ' + response.responseText);
    });
  }

  function bulkRemoveTasks() {
    const selected = getSelectedTasks();
    if (selected.length === 0) {
      alert('Please select at least one task to remove.');
      return;
    }
    if (!confirm('Are you sure you want to remove ' + selected.length + ' task(s)?')) {
      return;
    }
    $.ajax({
      url: '/skipper/admin/scheduler/bulk-remove',
      type: 'POST',
      data: JSON.stringify(selected),
      contentType: 'application/json',
      dataType: 'json'
    }).done(function(response) {
      alert('Successfully removed ' + response.successful.length + ' task(s). Failed: ' + response.failed.length);
      showDLQ();
    }).fail(function(response) {
      alert('Failed to remove tasks: ' + response.responseText);
    });
  }

  function bulkCancelWorkflowsFromDLQ() {
    const selected = getSelectedTasks();
    if (selected.length === 0) {
      alert('Please select at least one task to cancel workflows for.');
      return;
    }
    if (!confirm('Are you sure you want to cancel workflows for ' + selected.length + ' selected task(s)? Only WORKFLOW type tasks will be processed.')) {
      return;
    }
    $.ajax({
      url: '/skipper/admin/scheduler/bulk-cancel-workflows',
      type: 'POST',
      data: JSON.stringify(selected),
      contentType: 'application/json',
      dataType: 'json'
    }).done(function(response) {
      const ignoredCount = response.failed.length - (selected.length - response.successful.length);
      let message = 'Successfully cancelled ' + response.successful.length + ' workflow(s).';
      if (response.failed.length > 0) {
        message += ' ' + (response.failed.length - Math.max(0, ignoredCount)) + ' failed.';
        if (ignoredCount > 0) {
          message += ' ' + ignoredCount + ' non-WORKFLOW tasks were ignored.';
        }
      }
      alert(message);
      showDLQ();
    }).fail(function(response) {
      alert('Failed to cancel workflows: ' + response.responseText);
    });
  }

  /**
   * Simple hash based routing
   */
  function route() {
    const hash = window.location.hash.substring(1); // Remove the #
    $(window).off('scroll.workflows');
    if (hash.startsWith('workflow/')) {
      view_workflow(decodeURIComponent(hash.substring('workflow/'.length)));
    } else if (hash === 'exhausted-retries') {
      loadExhaustedRetries();
    } else if (hash === 'dlq') {
      loadDLQ();
    } else if (hash === 'cluster') {
      loadCluster();
    } else if (hash === 'workflows') {
      loadWorkflows();
    } else {
      loadHome();
    }
  }

  window.addEventListener('hashchange', route);

  $(document).ready(function() {
    refreshNavCounts();
    route();
  });
</script>
</body>
</html>
