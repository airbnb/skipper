<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skipper Admin</title>
  <style>
    :root {
      --bg: #0d1015; --panel: #151920; --panel-2: #1b2029; --border: #262d38; --border-2: #323a47; --row-line: #1d222b;
      --text: #d9dee6; --muted: #8b95a5; --faint: #5c6574;
      --ok: #3fb950; --warn: #d29922; --err: #f85149; --timer: #58a6ff; --wait: #6e7681;
      --signal: #bc8cff; --child: #39c5cf; --comp: #f0883e; --accent: #4c8dff; --sel: #1f3a5f;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      /* Width of the four text columns left of the waterfall lane; the lane overlay is offset by it. */
      --tl-cols: 290px 84px 100px 64px;
      --tl-left: 538px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
    code, .mono { font-family: var(--mono); font-size: 12px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    pre { margin: 0; font-family: var(--mono); font-size: 11.5px; white-space: pre; color: #c9d1d9; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    [hidden] { display: none !important; }

    /* Shell */
    .shell { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 100vh; }
    .side { background: #0a0d11; border-right: 1px solid var(--border); padding: 14px 10px; }
    /* Same lockup as the skipper.airbnb.tech header: compass mark 36px, wordmark 28px, 0.55rem gap. */
    .brand { display: flex; align-items: center; gap: 0.55rem; padding: 2px 8px 18px; color: #fff; }
    .brand .mark { height: 36px; width: auto; display: block; }
    .brand .wordmark { height: 28px; width: auto; display: block; }
    .brand:hover { text-decoration: none; }
    .nav a { display: flex; justify-content: space-between; align-items: center; color: var(--muted); padding: 7px 10px; border-radius: 6px; margin-bottom: 2px; }
    .nav a:hover { color: var(--text); text-decoration: none; background: #141922; }
    .nav a.on { background: var(--panel-2); color: var(--text); }
    .nav .count { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--panel-2); color: var(--muted); }
    .nav .count.warn { background: #3b2e0e; color: var(--warn); }
    .nav .count.err { background: #3d1614; color: var(--err); }
    .nav .sec { font-size: 10.5px; letter-spacing: .08em; color: var(--faint); padding: 16px 10px 6px; text-transform: uppercase; }
    .main { padding: 0 22px 30px; min-width: 0; }
    .topbar { display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid var(--border); margin: 0 -22px 18px; padding: 0 22px; }
    .crumbs { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crumbs b { color: var(--text); font-weight: 500; }
    .crumbs a { color: var(--muted); }
    .search { margin: 0 0 0 auto; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 0 10px; width: 340px; }
    .search input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; padding: 6px 0; min-width: 0; }
    .search input::placeholder { color: var(--faint); }
    .kbd { font-size: 11px; border: 1px solid var(--border-2); border-radius: 4px; padding: 0 5px; color: var(--faint); }

    /* Page header */
    .page-h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .page-h h1 { font-size: 20px; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 10px; min-width: 0; overflow-wrap: anywhere; }
    .page-h .count-lg { color: var(--muted); font-size: 14px; }
    .page-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

    /* Controls */
    .btn { background: var(--panel-2); border: 1px solid var(--border-2); color: var(--text); border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
    .btn:hover { border-color: #47505f; }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .btn.danger { color: var(--err); }
    .btn.sm { padding: 3px 9px; font-size: 12px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 14px; border: 1px solid var(--border-2); color: var(--text); background: transparent; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .chip i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
    .chip.on { background: var(--sel); border-color: #2f5a8f; }
    .chip.off { color: var(--faint); border-style: dashed; }
    .chip .n { color: var(--muted); }
    .seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 6px; overflow: hidden; }
    .seg button { white-space: nowrap; background: transparent; border: 0; padding: 4px 10px; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; }
    .seg button.on { background: var(--panel-2); color: var(--text); }
    .inp { background: var(--bg); border: 1px solid var(--border-2); border-radius: 6px; padding: 6px 10px; color: var(--text); font: inherit; font-size: 12.5px; min-width: 150px; color-scheme: dark; }
    .inp::placeholder { color: var(--faint); }
    .cb { width: 14px; height: 14px; accent-color: var(--accent); vertical-align: middle; margin: 0; cursor: pointer; }

    /* Dropdowns: a .dd wraps a [data-dd] toggle and a .dd-menu; see toggleDropdown(). */
    .dd { position: relative; display: inline-block; }
    .dd-menu { display: none; position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 8px; padding: 5px; min-width: 200px; box-shadow: 0 10px 30px #0008; max-height: 320px; overflow-y: auto; }
    .dd-menu.left { left: 0; right: auto; }
    .dd.open > .dd-menu { display: block; }
    .dd-menu a, .dd-menu label { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 5px; color: var(--text); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
    .dd-menu a:hover, .dd-menu label:hover { background: var(--sel); text-decoration: none; }
    .dd-menu a.danger { color: var(--err); }
    .dd-menu hr { border: 0; border-top: 1px solid var(--border-2); margin: 5px 0; }
    .dd-toggle { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; }
    .kebab { background: transparent; border: 1px solid transparent; color: var(--muted); padding: 1px 8px; border-radius: 4px; cursor: pointer; font: inherit; }
    tr:hover .kebab, .kebab:focus { border-color: var(--border-2); }

    /* Status pills */
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; letter-spacing: .02em; white-space: nowrap; }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .s-run { color: var(--timer); background: #11263f; }
    .s-wait { color: #a5b4fc; background: #1e1f3d; }
    .s-ok { color: var(--ok); background: #0f2a17; }
    .s-warn { color: var(--warn); background: #2f2510; }
    .s-err { color: var(--err); background: #34151a; }
    .s-mute { color: var(--muted); background: #1f242c; }
    .s-comp { color: var(--comp); background: #33200f; }
    .tag { font-size: 10.5px; padding: 0 6px; border-radius: 9px; background: #3b2e0e; color: var(--warn); white-space: nowrap; }
    .tag.blue { background: #11263f; color: var(--timer); }
    .tag.grey { background: var(--panel-2); color: var(--muted); }
    .type-tag { font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--border-2); color: var(--text); }

    /* Cards and tables */
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; }
    .card-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .card-h h2 { font-size: 14px; margin: 0; font-weight: 600; }
    .card-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .scroll-x { overflow-x: auto; }
    table.tbl { width: 100%; border-collapse: collapse; }
    .tbl th, .tbl td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--row-line); vertical-align: middle; white-space: nowrap; }
    .tbl th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 500; background: var(--panel-2); border-bottom-color: var(--border); }
    .tbl th a { color: inherit; }
    .tbl td { font-size: 12.5px; }
    .tbl tr:last-child td { border-bottom: 0; }
    .tbl tbody tr:hover td { background: #1a1f27; }
    .tbl tr.sel-row td { background: #172437; }
    .tbl .r { text-align: right; }
    .tbl .dim { color: var(--muted); }
    .tbl td.wrap { white-space: normal; }
    .tbl a.mono { color: var(--accent); }
    .tbl pre { max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
    .type { font-size: 10.5px; color: var(--muted); background: var(--panel-2); padding: 1px 6px; border-radius: 4px; margin-left: 6px; font-family: inherit; }
    .errmsg { font-family: var(--mono); font-size: 11.5px; color: #ffb1ab; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .foot { display: flex; justify-content: space-between; padding: 10px 14px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }
    .note { color: var(--muted); font-size: 12px; padding: 12px 14px; border-top: 1px solid var(--border); line-height: 1.55; }
    .empty { color: var(--muted); padding: 28px 14px; text-align: center; }
    .alert { border: 1px solid #5a4410; background: #231b08; color: #e3c46b; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; line-height: 1.5; }
    .alert.grey { border-color: var(--border-2); background: var(--panel); color: var(--muted); }
    .selbar { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 12.5px; flex-wrap: wrap; }
    .selbar.active { background: #13233a; border-bottom-color: #23406a; }
    .selbar .right { margin-left: auto; display: flex; gap: 8px; }
    .quick { display: flex; gap: 6px; padding: 12px 14px; flex-wrap: wrap; align-items: center; }

    /* Key/value strip (workflow details, cluster summary) */
    .details { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 14px 4px; }
    .details .f { padding: 0 14px; border-left: 1px solid var(--border); min-width: 0; }
    .details .f:first-child { border-left: 0; }
    .details .f.wide { grid-column: span 1; }
    .details .l { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .details .v { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .details .v.mono { font-size: 12.5px; }
    .copy { background: transparent; border: 0; color: var(--faint); cursor: pointer; padding: 0 0 0 4px; font: inherit; }
    .copy:hover { color: var(--text); }

    /* Overview tiles */
    .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; color: var(--text); display: block; }
    a.tile:hover { text-decoration: none; border-color: var(--border-2); }
    .tile .l { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .tile .v { font-size: 28px; font-weight: 600; margin: 4px 0 2px; }
    .tile .s { color: var(--muted); font-size: 12px; }
    .tile.warn .v { color: var(--warn); }
    .tile.err .v { color: var(--err); }
    .tile.zero .v { color: var(--text); }

    /* Filters */
    .filters { display: flex; gap: 10px; align-items: flex-end; padding: 12px 14px 0; flex-wrap: wrap; }
    .fld { display: flex; flex-direction: column; gap: 4px; }
    .fld > label { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

    /* Tabs */
    .tabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; font: inherit; font-size: 12.5px; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
    .tabs em { font-style: normal; font-size: 11px; color: var(--faint); margin-left: 4px; }

    /* Workflow timeline (waterfall) */
    .tl-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
    .tl { min-width: 0; border-right: 1px solid var(--border); overflow-x: auto; }
    .tl-body { position: relative; min-width: 860px; }
    .tl-row { display: grid; grid-template-columns: var(--tl-cols) minmax(0, 1fr); align-items: center; height: 28px; border-bottom: 1px solid var(--row-line); position: relative; cursor: pointer; }
    .tl-row > div { padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tl-row:hover { background: #171c24; }
    .tl-row.sel { background: var(--sel); }
    .tl-row.hdr { height: 30px; background: var(--panel-2); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; border-bottom-color: var(--border); cursor: default; }
    .tl-row.ov { height: 46px; background: #11151b; border-bottom-color: var(--border); cursor: default; }
    .tl-row.hdr:hover, .tl-row.ov:hover { background: var(--panel-2); }
    .tl-row.ov:hover { background: #11151b; }
    .tl-row.sub > div:first-child { padding-left: 32px; }
    .tl-row .num { text-align: right; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
    .tl-row .st { font-size: 11.5px; }
    .tl-name { display: flex; align-items: center; gap: 7px; }
    .tl-name .tw { color: var(--faint); width: 12px; font-size: 10px; flex: none; text-align: center; }
    .tl-name .ic { width: 16px; height: 16px; border-radius: 4px; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; color: #0d1015; flex: none; }
    .tl-name code { overflow: hidden; text-overflow: ellipsis; }
    .tl-name .it { color: var(--faint); font-family: var(--mono); font-size: 11px; }
    .lane { position: relative; height: 100%; padding: 0 !important; overflow: hidden !important; }
    .tl-row.hdr .lane { overflow: visible !important; }
    .bar { position: absolute; top: 8px; height: 12px; border-radius: 2px; min-width: 2px; }
    .bar.hatch { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.14) 0 3px, transparent 3px 7px); }
    .bar.ghost { background: transparent !important; border: 1px dashed; top: 9px; height: 10px; opacity: .6; }
    .bar.thin { top: 12px; height: 4px; }
    .diamond { position: absolute; top: 8px; width: 12px; height: 12px; transform: translateX(-6px) rotate(45deg); border-radius: 2px; }
    .blabel { position: absolute; top: 6px; font-size: 11px; color: var(--muted); white-space: nowrap; font-family: var(--mono); pointer-events: none; }
    .blabel.before { transform: translateX(-100%); }
    .tl-grid { position: absolute; top: 0; bottom: 0; left: var(--tl-left); right: 0; pointer-events: none; z-index: 1; }
    .tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid #1f2530; }
    .ticklab { position: absolute; top: 8px; font-size: 10.5px; color: var(--muted); transform: translateX(4px); font-family: var(--mono); white-space: nowrap; text-transform: none; letter-spacing: 0; }
    .vline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed; }
    .vline.now { border-left: 1.5px solid #e6edf3; }
    .vline.timeout { border-color: var(--err); }
    .vlabel { position: absolute; bottom: 1px; font-size: 10px; font-weight: 600; padding: 0 5px; border-radius: 3px; white-space: nowrap; transform: translateX(-50%); letter-spacing: .04em; z-index: 2; }
    .vlabel.now { background: #e6edf3; color: #0d1015; }
    .vlabel.timeout { background: var(--err); color: #fff; }
    .brk { position: absolute; top: 0; bottom: 0; width: 8px; transform: translateX(-4px); background: repeating-linear-gradient(90deg, transparent 0 3px, var(--bg) 3px 5px, transparent 5px 8px); opacity: .9; }
    .ov-seg { position: absolute; height: 6px; border-radius: 1px; min-width: 2px; }
    .tl-legend { display: flex; gap: 16px; padding: 9px 14px; color: var(--muted); font-size: 11.5px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .tl-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .tl-legend i { width: 18px; height: 9px; border-radius: 2px; display: inline-block; }
    .hatch-swatch { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.14) 0 3px, transparent 3px 7px); }
    .c-ok { background-color: var(--ok); } .c-warn { background-color: var(--warn); } .c-err { background-color: var(--err); }
    .c-wait { background-color: var(--wait); } .c-timer { background-color: var(--timer); } .c-signal { background-color: var(--signal); }
    .c-child { background-color: var(--child); } .c-wf { background-color: #3a4352; } .c-task { background-color: var(--faint); }
    .c-comp { background-color: var(--comp); }
    .ghost.c-ok { border-color: var(--ok); } .ghost.c-warn { border-color: var(--warn); } .ghost.c-wait { border-color: var(--wait); }
    .ghost.c-timer { border-color: var(--timer); } .ghost.c-wf { border-color: #5a6578; } .ghost.c-task { border-color: var(--faint); }
    .ghost.c-child { border-color: var(--child); }
    .t-ok { color: var(--ok); } .t-warn { color: var(--warn); } .t-err { color: var(--err); } .t-timer { color: var(--timer); }
    .t-wait { color: var(--muted); } .t-signal { color: var(--signal); } .t-child { color: var(--child); } .t-comp { color: var(--comp); }

    /* Timeline detail drawer */
    .drawer { background: #12161c; min-width: 0; border-bottom-right-radius: 10px; }
    .dr-h { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .dr-h .t { font-family: var(--mono); font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
    .dr-h .s { color: var(--muted); margin-top: 3px; }
    .dr-b { padding: 12px 14px; }
    .dr-sec { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 8px; }
    .dr-sec:first-child { margin-top: 0; }
    .tline { display: grid; grid-template-columns: 96px minmax(0, 1fr) 64px; gap: 8px; align-items: center; margin-bottom: 7px; font-size: 12px; }
    .tline .track { position: relative; height: 10px; background: #1b2029; border-radius: 2px; }
    .tline .track b { position: absolute; top: 0; bottom: 0; border-radius: 2px; min-width: 2px; }
    .tline .d { text-align: right; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
    .sum { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--border); margin-top: 10px; padding-top: 9px; font-size: 12px; flex-wrap: wrap; }
    .err-box { background: #1e1213; border: 1px solid #4a1f1e; border-radius: 6px; padding: 8px 10px; font-family: var(--mono); font-size: 11.5px; color: #ffb1ab; margin-top: 8px; line-height: 1.5; overflow-wrap: anywhere; }
    .err-box .h { color: var(--err); font-weight: 600; }
    .err-list { display: flex; flex-direction: column; gap: 6px; }
    .err-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; text-align: left; background: #1e1213; border: 1px solid #4a1f1e; border-radius: 6px; padding: 7px 10px; cursor: pointer; font: inherit; color: inherit; width: 100%; }
    .err-row:hover, .err-row.on { border-color: #7a2d2b; background: #261517; }
    .err-row .h { font-family: var(--mono); font-size: 11.5px; color: var(--err); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .err-row .m { grid-column: 1; font-family: var(--mono); font-size: 11.5px; color: #ffb1ab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .err-row .go { grid-column: 2; grid-row: 1 / span 2; align-self: center; color: var(--muted); font-size: 16px; }
    .kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 10px; font-size: 12px; }
    .kv .k { color: var(--muted); }
    .kv .v { overflow-wrap: anywhere; }
    .dr-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

    /* Cluster */
    .bucket-stack { display: flex; height: 40px; border-radius: 8px; overflow: hidden; margin: 6px 0 8px; border: 1px solid var(--border); }
    .bucket-stack div { display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11.5px; color: #0d1015; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-right: 2px solid var(--panel); padding: 0 6px; }
    .bucket-stack div:last-child { border-right: 0; }
    .bucket-stack div.me { box-shadow: inset 0 0 0 2px #fff; }
    .scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
    .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: middle; }
    .share { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
    .share .trk { width: 120px; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
    .share .trk b { display: block; height: 100%; }
    .section-h { padding: 12px 14px 4px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .section-h h3 { margin: 0; font-size: 13.5px; font-weight: 600; }
    .section-h span { color: var(--muted); font-size: 12px; }

    /* Modal */
    .modal-bg { position: fixed; inset: 0; background: #000a; z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 60px 16px; }
    .modal { background: var(--panel); border: 1px solid var(--border-2); border-radius: 10px; width: 100%; max-width: 860px; max-height: calc(100vh - 120px); display: flex; flex-direction: column; }
    .modal-h { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .modal-h h3 { margin: 0; font-size: 14px; font-weight: 600; }
    .modal-h .x { margin-left: auto; background: transparent; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; }
    .modal.wide { max-width: 1080px; }
    .modal-body { overflow: auto; flex: 1; padding: 14px 16px; min-height: 0; }
    .modal-body > pre.plain { white-space: pre-wrap; word-break: break-word; }
    .modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); }
    .modal-f .left { margin-right: auto; display: flex; gap: 8px; align-items: center; }
    .trace { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; overflow: auto; max-height: 52vh; line-height: 1.55; white-space: pre; }
    .trace .hd { color: #ffb1ab; font-weight: 600; }
    .trace .fr { color: #c9d1d9; }
    .trace .fr.lib { color: var(--faint); }
    .err-sum { background: #1e1213; border: 1px solid #4a1f1e; border-radius: 6px; padding: 10px 12px; margin: 12px 0; font-family: var(--mono); font-size: 12px; color: #ffb1ab; overflow-wrap: anywhere; }
    .err-sum .h { color: var(--err); font-weight: 600; margin-bottom: 2px; }

    @media (max-width: 1180px) {
      .tl-wrap { grid-template-columns: minmax(0, 1fr); }
      .tl { border-right: 0; border-bottom: 1px solid var(--border); }
      .details { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 14px; }
      .details .f:nth-child(odd) { border-left: 0; }
    }
    @media (max-width: 760px) {
      .shell { grid-template-columns: minmax(0, 1fr); }
      .side { border-right: 0; border-bottom: 1px solid var(--border); padding: 10px 16px; }
      .brand { padding: 0 0 8px; }
      .nav { display: flex; flex-wrap: wrap; gap: 4px; }
      .nav .sec { display: none; }
      .nav a { margin: 0; }
      .main { padding: 0 16px 24px; }
      .topbar { margin: 0 -16px 14px; padding: 0 16px; }
      .search { width: auto; flex: 1; }
      .crumbs { display: none; }
      .tiles { grid-template-columns: minmax(0, 1fr); }
      .details { grid-template-columns: minmax(0, 1fr); }
      .details .f { border-left: 0; }
    }
  </style>
</head>

<!-- Data viewer modal (action results, signal inputs, errors) -->
<div class="modal-bg" id="data_modal" hidden onclick="if (event.target === this) closeModal()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="data_modal_title">
    <div class="modal-h"><h3 id="data_modal_title"></h3><button class="x" onclick="closeModal()" aria-label="Close">×</button></div>
    <div class="modal-body" id="data_modal_body"></div>
    <div class="modal-f"><div class="left" id="data_modal_extra"></div><button class="btn" onclick="copyText(_modalCopyText, this)">Copy</button><button class="btn primary" onclick="closeModal()">Close</button></div>
  </div>

<!----------------------------------------------------------------------------------------------------------------------
Overview
----------------------------------------------------------------------------------------------------------------------->
<script id="home_view" type="text/x-handlebars-template">
  <div class="page-h"><h1>Overview</h1></div>
  <div class="tiles">
    <a class="tile {{#gt stats.exhausted_retries_count 0}}warn{{else}}zero{{/gt}}" href="#exhausted-retries">
      <div class="l">Exhausted retries</div>
      <div class="v">{{stats.exhausted_retries_count}}</div>
      <div class="s">Workflows that used up their retries and need manual intervention</div>
    </a>
    <a class="tile {{#gt stats.dlq_tasks_count 0}}err{{else}}zero{{/gt}}" href="#dlq">
      <div class="l">Dead letter queue</div>
      <div class="v">{{stats.dlq_tasks_count}}</div>
      <div class="s">Scheduler tasks that failed and stopped being retried</div>
    </a>
    <div class="tile zero">
      <div class="l">Scheduler backlog</div>
      <div class="v">{{stats.scheduler_backlog_count}}</div>
      <div class="s">Tasks due to run that no worker has picked up yet</div>
    </div>
  </div>
  <div class="card">
    <div class="card-h"><h2>Recent workflows</h2><div class="right"><a href="#workflows">View all →</a></div></div>
    <div class="scroll-x" id="recent-workflows"><div class="empty">Loading…</div></div>
  </div>
</script>

<!----------------------------------------------------------------------------------------------------------------------
Workflow detail view
----------------------------------------------------------------------------------------------------------------------->
<script id="workflow_detail_view" type="text/x-handlebars-template">
  <div class="page-h">
    <h1><span>{{classname instance.workflow_class}}.{{instance.workflow_method}}</span> {{{status_pill instance.status}}}</h1>
    <div class="right">
      <div class="dd">
        <button class="btn primary" data-dd>Actions ▾</button>
        <div class="dd-menu">
          {{! Retry re-executes via reExecuteWorkflows, which rejects terminal states — so gate on
              the non-terminal failed statuses only (ERROR is terminal; it uses Reset to Running). }}
          {{#if_in instance.status 'RETRIES_EXHAUSTED,TRANSIENT_ERROR,COMPENSATION_ERROR'}}
          <a href="#" onclick="retryWorkflowDetail(currentWorkflowId()); return false">Retry now</a>
          {{/if_in}}
          {{#if_eq instance.status 'ERROR'}}
          <a href="#" onclick="resetWorkflowFromError(currentWorkflowId()); return false">Reset to Running</a>
          {{/if_eq}}
          <a href="#" onclick="copyText(location.href, null); return false">Copy link</a>
          {{#unless terminal}}
          <hr>
          <a href="#" class="danger" onclick="cancelWorkflow(currentWorkflowId()); return false">Cancel workflow</a>
          {{/unless}}
          {{#if terminal}}
          <hr>
          <a href="#" class="danger" onclick="deleteWorkflow(currentWorkflowId()); return false">Delete workflow</a>
          {{/if}}
        </div>
      </div>
    </div>
  </div>

  <div class="card details">
    <div class="f"><div class="l">Workflow ID</div><div class="v mono">{{instance.workflow_id}}<button class="copy" title="Copy" onclick="copyText(currentWorkflowId(), this)">⧉</button></div></div>
    <div class="f"><div class="l">Parent workflow</div><div class="v mono">{{#if instance.parent_workflow_id}}<a href="#workflow/{{instance.parent_workflow_id}}">{{instance.parent_workflow_id}}</a>{{else}}<span class="muted">—</span>{{/if}}</div></div>
    <div class="f"><div class="l">Started</div><div class="v" title="{{instance.created_at}}">{{to_local_date instance.created_at}}</div></div>
    <div class="f"><div class="l">Ended</div><div class="v" title="{{#if terminal}}{{instance.updated_at}}{{/if}}">{{#if terminal}}{{to_local_date instance.updated_at}}{{else}}<span class="muted">— not finished</span>{{/if}}</div></div>
    <div class="f"><div class="l">Duration</div><div class="v">{{elapsed}}</div></div>
  </div>

  <div class="card">
    <div class="card-h">
      <h2>Timeline</h2>
      <div class="chips" id="tl-kinds" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      <div class="right">
        <div class="seg" id="tl-scale"><button data-v="compressed">Compressed idle</button><button data-v="linear">Linear</button></div>
        <div class="seg" id="tl-expand"><button data-v="expand">Expand all</button><button data-v="collapse">Collapse all</button></div>
      </div>
    </div>
    <div class="tl-wrap">
      <div class="tl"><div class="tl-body" id="tl-body"></div></div>
      <div class="drawer" id="tl-drawer"></div>
    </div>
    <div class="tl-legend">
      <span><i class="c-ok"></i>Action ran</span>
      <span><i class="c-warn"></i>Transient failure</span>
      <span><i class="c-err"></i>Failed</span>
      <span><i class="c-wait hatch-swatch"></i>Retry backoff</span>
      <span><i class="c-timer hatch-swatch"></i>Timer wait</span>
      <span><i style="border:1px dashed var(--timer)"></i>Planned, not reached</span>
      <span><i class="c-signal" style="width:9px;transform:rotate(45deg)"></i>Signal</span>
      <span><i class="c-child"></i>Child workflow</span>
      <span><i style="border-left:2px dashed var(--err);width:2px;border-radius:0"></i>Workflow timeout</span>
      <span><i style="border-left:2px solid #e6edf3;width:2px;border-radius:0"></i>Now</span>
    </div>
  </div>

  <div class="card">
    <div class="tabs" id="detail-tabs">
      <button data-tab="state">State <em>{{state_count}}</em></button>
      <button data-tab="input">Input</button>
      <button data-tab="result">Result</button>
      <button data-tab="timers">Timers <em>{{timers.length}}</em></button>
      <button data-tab="tasks">Scheduled tasks <em>{{tasks.length}}</em></button>
      <button data-tab="signals">Signals <em id="signals-count">…</em></button>
      <button data-tab="children">Child workflows <em id="children-count">…</em></button>
      <button data-tab="raw">Raw JSON</button>
    </div>
    <div data-pane="state" class="scroll-x">
      {{#if state_count}}
      <table class="tbl">
        <thead><tr><th style="width:28%">Field</th><th>Value</th></tr></thead>
        <tbody>
        {{#each instance.state}}
        <tr><td><code>{{@key}}</code><span class="type">{{classname type}}</span></td><td class="wrap"><pre>{{to_json_tabs value}}</pre></td></tr>
        {{/each}}
        </tbody>
      </table>
      {{else}}<div class="empty">This workflow has no state fields.</div>{{/if}}
    </div>
    <div data-pane="input" class="scroll-x">
      <table class="tbl">
        <thead><tr><th style="width:28%">Type</th><th>Value</th></tr></thead>
        <tbody><tr><td><code>{{classname instance.input.type}}</code></td><td class="wrap"><pre>{{to_json_tabs instance.input.value}}</pre></td></tr></tbody>
      </table>
    </div>
    <div data-pane="result" class="scroll-x">
      {{#if instance.result}}
      {{#if instance.result.success}}
      <table class="tbl">
        <thead><tr><th style="width:28%">Type</th><th>Value</th></tr></thead>
        <tbody><tr><td><code>{{classname instance.result.ok.type}}</code></td><td class="wrap"><pre>{{to_json_tabs instance.result.ok.value}}</pre></td></tr></tbody>
      </table>
      {{else}}
      <div class="dr-b"><div class="err-box" style="margin:0"><div class="h">{{classname instance.result.error.type}}</div><pre class="stack">{{to_json_tabs instance.result.error.value}}</pre></div></div>
      {{/if}}
      {{else}}<div class="empty">No result yet.</div>{{/if}}
    </div>
    <div data-pane="timers" class="scroll-x">
      {{#if timers.length}}
      <table class="tbl">
        <thead><tr><th>ID</th><th>Status</th><th>Created</th><th>Duration</th><th>Expires</th></tr></thead>
        <tbody>
        {{#each timers}}
        <tr><td><code>{{id}}</code></td><td>{{{status_pill status}}}</td><td class="dim">{{to_local_date created_at}}</td><td class="mono">{{iso_duration duration}}</td><td class="dim">{{to_local_date expires_at}}</td></tr>

<script id="cluster_view" type="text/x-handlebars-template">
  <div class="page-h"><h1>Cluster</h1>
    <div class="right"><span class="muted" style="font-size:12px">Updated {{loaded_at}}</span><button class="btn" onclick="loadCluster()">⟳ Refresh</button></div></div>
  <div class="card details">
    <div class="f"><div class="l">Cluster</div><div class="v mono">{{#if cluster_name}}{{cluster_name}}{{else}}<span class="muted">—</span>{{/if}}</div></div>
    <div class="f"><div class="l">This instance</div><div class="v mono">{{#if current_member_id}}{{current_member_id}} <span class="tag blue">registered</span>{{else}}<span class="muted">not registered</span>{{/if}}</div></div>
    <div class="f"><div class="l">Live members</div><div class="v">{{members.length}}</div></div>
    <div class="f"><div class="l">Task partitioning</div><div class="v">{{#if partitioning_active}}<span class="pill s-ok">ACTIVE</span>{{else}}<span class="pill s-mute">INACTIVE</span> <span class="muted" style="font-size:12px">· fetching from the whole queue</span>{{/if}}</div></div>
  </div>
  {{#if members.length}}
  {{#unless partitioning_active}}
  <div class="alert">
    Partitioning is not active on this instance, so it fetches from the whole queue regardless of the
    assignment below. The ranges show what each member would own if it were: check that the
    <code>task_partitioning</code> feature key is enabled and that this instance is a registered member.
  </div>
  {{/unless}}
  <div class="card">
    <div class="section-h"><h3>Bucket assignment</h3><span>task ID hashed with CRC32 into {{total_buckets}} buckets, split evenly by member ID</span></div>
    <div style="padding: 4px 14px 14px">
      <div class="bucket-stack">
        {{#each members}}<div class="{{#if current}}me{{/if}}" style="width:{{share}}%;background:{{color}}" title="{{member_id}}: buckets [{{start_bucket_inclusive}}, {{end_bucket_exclusive}}) — {{share}}%">{{member_id}}</div>{{/each}}
      </div>
      <div class="scale"><span>0</span><span>{{quarter 1}}</span><span>{{quarter 2}}</span><span>{{quarter 3}}</span><span>{{total_buckets}}</span></div>
    </div>
    <div class="scroll-x">
      <table class="tbl">
        <thead><tr><th style="width:34px"></th><th>Member</th><th>Bucket range</th><th class="r">Buckets</th><th class="r" style="width:220px">Share</th></tr></thead>
        <tbody>
          {{#each members}}
          <tr>
            <td><span class="sw" style="background:{{color}}"></span></td>
            <td class="mono">{{member_id}} {{#if current}}<span class="tag blue">this instance</span>{{/if}}</td>
            <td class="mono">[{{start_bucket_inclusive}}, {{end_bucket_exclusive}})</td>
            <td class="r mono">{{bucket_count}}</td>
            <td><div class="share"><div class="trk"><b style="width:{{share}}%;background:{{color}}"></b></div><span class="mono">{{share}}%</span></div></td>
          </tr>
          {{/each}}
        </tbody>
      </table>
    </div>
    <div class="note">
      Members are ordered by ID and split the {{total_buckets}} buckets evenly, the first members taking one
      extra when it does not divide. A member that stops gracefully leaves this list at once; one that
      crashes drops out after the liveness window. Either way its buckets are redistributed among the rest.
    </div>
  </div>
  {{else}}
  <div class="alert grey">
    No live cluster members. Either this instance has not registered yet (the first heartbeat has not
    landed), or the configured <code>clusterMembershipManager</code> does not track membership, in which
    case every instance fetches from the whole queue.
  </div>
  {{/if}}
</script>

<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
<script>
  // ===================================================================================================================
  // Shared helpers
  // ===================================================================================================================

  // Mirrors WorkflowInstance.Status.isTerminal().
  const TERMINAL_STATUSES = ['COMPLETED', 'ERROR', 'TIMEOUT', 'COMPENSATION_COMPLETED', 'CANCELLED'];
  const ALL_STATUSES = ['RUNNING', 'WAITING', 'CREATED', 'COMPLETED', 'ERROR', 'TRANSIENT_ERROR', 'RETRIES_EXHAUSTED',
    'TIMEOUT', 'CANCELLED', 'COMPENSATION_IN_PROGRESS', 'COMPENSATION_ERROR', 'COMPENSATION_COMPLETED'];

  function isTerminal(status) {
    return TERMINAL_STATUSES.indexOf(status) !== -1;
  }

  // JavaScript's Number type only safely represents integers up to 2^53-1 (Number.MAX_SAFE_INTEGER).
  // Java Long/i64 values can reach 2^63-1. When jQuery parses JSON via native JSON.parse(), any
  // integer exceeding 2^53-1 silently loses precision (e.g. 9007199254740993 becomes 9007199254740992).
  //
  // safeParse works around this by pre-processing the raw JSON text: it finds integer values with
  // 16+ digits (the threshold where precision loss can occur) and wraps them in quotes so they
  // become JSON strings instead of numbers. The lookbehind (?<=") ensures we only match a colon
  // that follows a JSON key's closing quote, preventing false matches on large integers that
  // appear inside string values (e.g. "fileId: 1689209556184977785" in an error message).
  function safeParse(text) {
    return JSON.parse(text.replace(/(?<=")(\s*):(\s*)(-?\d{16,})\b/g, '$1:$2"$3"'));
  }

  // Wrapper around $.ajax that fetches JSON as raw text and applies safeParse,
  // preventing large integer truncation that would occur with $.get's automatic JSON parsing.
  function safeGet(url, onSuccess, onFail) {
    $.ajax({
      url: url,
      dataType: 'text',
      success: function(text) { onSuccess(safeParse(text)); },
      error: onFail
    });
  }

  // Minimal HTML-escaper for values interpolated into markup built by string concatenation
  // (workflow-supplied ids, signal method names, error messages, etc.), so a crafted value cannot inject markup.
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // The simple name of a JVM class; for a nested class (Outer$Inner) the inner name, which is the one
  // people recognise. Anonymous classes ($1) keep their outer name.
  function simpleClassName(clazz) {
    if (!clazz) return '';
    const name = String(clazz).split('.').pop();
    const inner = name.split('$').pop();
    return inner && !/^\d+$/.test(inner) ? inner : name;
  }

  function toMillis(iso) {
    if (!iso) return null;
    const t = Date.parse(iso);
    return isNaN(t) ? null : t;
  }

  function formatLocalDate(iso) {
    const t = toMillis(iso);
    if (t === null) return '';
    const d = new Date(t);
    const sameYear = d.getFullYear() === new Date().getFullYear();
    return d.toLocaleString('en-US', {
      month: 'short', day: 'numeric', year: sameYear ? undefined : 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
  }

  // Compact human duration: 42ms, 2.00s, 18.4s, 6m 34s, 2h 5m, 3d 4h.
  function formatDuration(ms) {
    if (ms === null || ms === undefined || isNaN(ms) || ms < 0) return '';
    if (ms < 1000) return Math.round(ms) + 'ms';
    if (ms < 60000) return (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + 's';
    const s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
    if (d > 0) return d + 'd' + (h % 24 ? ' ' + (h % 24) + 'h' : '');
    if (h > 0) return h + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '');
    return m + 'm' + (s % 60 ? ' ' + (s % 60) + 's' : '');
  }

  // ISO-8601 durations as Jackson writes java.time.Duration (e.g. "PT4M", "PT1H30M", "PT0.5S").
  function parseIsoDuration(iso) {
    const m = /^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:([\d.]+)S)?)?$/.exec(iso || '');
    if (!m) return null;
    return ((+m[1] || 0) * 86400 + (+m[2] || 0) * 3600 + (+m[3] || 0) * 60 + (+m[4] || 0)) * 1000;
  }

  function workflowElapsedMs(wf) {
    const start = toMillis(wf.created_at);
    if (start === null) return null;
    const end = isTerminal(wf.status) ? toMillis(wf.updated_at) : Date.now();
    return end === null ? null : Math.max(0, end - start);
  }

  function statusPillClass(status) {
    switch (status) {
      case 'COMPLETED': case 'EXECUTED': case 'EXPIRED': return 's-ok';
      case 'ERROR': case 'TIMEOUT': case 'COMPENSATION_ERROR': case 'FAILED': return 's-err';
      case 'RETRIES_EXHAUSTED': case 'TRANSIENT_ERROR': return 's-warn';
      case 'RUNNING': case 'ACTIVE': case 'PENDING': return 's-run';
      case 'WAITING': case 'CREATED': return 's-wait';
      case 'COMPENSATION_IN_PROGRESS': return 's-comp';
      default: return 's-mute';
    }
  }

  function statusPill(status) {
    const s = String(status == null ? '' : status);
    return '<span class="pill ' + statusPillClass(s) + '">' + escapeHtml(s.replace(/_/g, ' ')) + '</span>';
  }

  function entryPoint(clazz, method) {
    return '<code>' + escapeHtml(simpleClassName(clazz)) + '</code><span class="muted">.' + escapeHtml(method || '') + '</span>';
  }

  function copyText(text, button) {
    const done = function() {
      if (!button) return;
      const old = button.textContent;
      button.textContent = '✓';
      setTimeout(function() { button.textContent = old; }, 1200);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }
  }

  Handlebars.registerHelper('if_eq', function(a, b, opts) {
    return a == b ? opts.fn(this) : opts.inverse(this);
  });
  Handlebars.registerHelper('gt', function(a, b, opts) {
    return a > b ? opts.fn(this) : opts.inverse(this);
  });
  Handlebars.registerHelper('if_in', function(value, list, opts) {
    return list.split(',').indexOf(value) !== -1 ? opts.fn(this) : opts.inverse(this);
  });
  Handlebars.registerHelper('classname', simpleClassName);
  Handlebars.registerHelper('to_json_tabs', function(obj) {
    if (typeof obj !== 'object' || obj === null) return obj;
    return JSON.stringify(obj, null, 4);
  });
  Handlebars.registerHelper('to_local_date', formatLocalDate);
  Handlebars.registerHelper('iso_duration', function(iso) {
    const ms = parseIsoDuration(iso);
    return ms === null ? iso : formatDuration(ms);
  });
  Handlebars.registerHelper('workflow_elapsed', function(wf) {
    const ms = workflowElapsedMs(wf);
    return ms === null ? '' : formatDuration(ms) + (isTerminal(wf.status) ? '' : '…');
  });
  Handlebars.registerHelper('status_pill', statusPill);
  Handlebars.registerHelper('entry_point', entryPoint);

  // ===================================================================================================================
  // Dropdowns, modal, tabs
  // ===================================================================================================================

  function closeDropdowns(except) {
    $('.dd.open').each(function() {
      if (this !== except) $(this).removeClass('open');
    });
  }

  $(document).on('click', '[data-dd]', function(e) {
    e.preventDefault();
    e.stopPropagation();
    const dd = $(this).closest('.dd')[0];
    closeDropdowns(dd);
    $(dd).toggleClass('open');
  });
  $(document).on('click', '[data-keep-open]', function(e) { e.stopPropagation(); });
  $(document).on('click', function() { closeDropdowns(null); });
  $(document).on('keydown', function(e) {
    if (e.key === 'Escape') {
      closeDropdowns(null);
      closeModal();
    } else if (e.key === '/' && !$(e.target).is('input, textarea')) {
      e.preventDefault();

  // Persisted signals for the workflow currently shown in the detail view. Held module-level so the
  // per-row "View input"/"View error" actions can look the payload up by index instead of embedding

  var _persistedSignals = [];

  function loadSignals(workflowId) {

  // Dispatch by array index (an integer), never the raw id, so a crafted signal/workflow id
  // cannot break out of the inline handler.
  function signalMenu(i) {
    const sig = _persistedSignals[i];
    let html = '<div class="dd"><button class="kebab" data-dd aria-label="Signal actions">⋯</button><div class="dd-menu">';
    if (sig.input !== null && sig.input !== undefined) {
      html += '<a href="#" onclick="viewSignalInput(' + i + '); return false">View input</a>';
    }
    if (sig.error) {
      html += '<a href="#" onclick="viewSignalError(' + i + '); return false">View error</a>';
    }
    html += '<a href="#" onclick="replaySignalByIndex(' + i + '); return false">Replay</a>';

  function viewSignalInput(i) {
    const sig = _persistedSignals[i];

    show_data('Signal input', typeof sig.input === 'string' ? sig.input : JSON.stringify(sig.input));
  }

  function viewSignalError(i) {
    const sig = _persistedSignals[i];
    if (!sig || !sig.error) return;
    show_data('Signal error', typeof sig.error === 'string' ? sig.error : JSON.stringify(sig.error));
  }

  function replaySignalByIndex(i) {
    const sig = _persistedSignals[i];
    if (!sig) return;
    replaySignal(_persistedSignalsWorkflowId, sig.id);
  }

  function replaySignal(workflowId, signalId) {
    if (!confirm('Replay this persisted signal? The workflow will re-process it.')) {
      return;
    }
    $.post('/skipper/admin/workflows/' + encodeURIComponent(workflowId) + '/signals/' + encodeURIComponent(signalId) + '/replay', function() {
      location.reload();
    }).fail(function(response) {
      alert('Failed to replay signal: ' + response.responseText);
    });
  }

  function rewindToCheckpoint(workflowId, actionClass, actionMethod, iteration, checkpointName) {
    if (!confirm('Rewind this workflow to the selected checkpoint?\n\nThis will:\n- Set the workflow status to RUNNING\n- DELETE this checkpoint and every checkpoint after it\n- Re-execute the workflow from this point\n\nThis operation CANNOT be undone.')) {
      return;
    }
    let params = 'actionClass=' + encodeURIComponent(actionClass) +
      '&actionMethod=' + encodeURIComponent(actionMethod) +
      '&iteration=' + encodeURIComponent(iteration);
    if (checkpointName) {
      params += '&checkpointName=' + encodeURIComponent(checkpointName);
    }
    $.post('/skipper/admin/workflows/' + encodeURIComponent(workflowId) + '/rewind?' + params, function() {
      alert('Workflow rewound to the selected checkpoint and rescheduled for execution.');
      location.reload();
    }).fail(function(response) {
      alert('Failed to rewind workflow: ' + response.responseText);
    });
  }

  function view_workflow(id) {
    view_workflow_internal('/skipper/admin/workflows/' + encodeURIComponent(id));
