# CircleCI configuration for airbnb/skipper.
#
# Four jobs run on every push:
#
#   jvm-build     Gradle: compiles the engine (Kotlin + Java, joint compilation) plus the
#                 skipper-state-machine plugin module, and runs both test subsets. A bare
#                 `gradlew build` from the root covers every project in the build. Also runs
#                 as a matrix, jvm-build-jackson-<version>, with each listed Jackson forced
#                 onto the runtime classpath (-PjacksonVersion): Skipper compiles against
#                 Jackson 2.9.10 and must still run on whatever a host service ships.
#
#   format-check  Fails when any Kotlin or Java source is not formatted: `gradlew spotlessCheck`
#                 (ktlint for Kotlin, google-java-format for Java; see build.gradle.kts).
#                 `./gradlew spotlessApply` repairs a failure. Its own job rather than part of
#                 jvm-build so a formatting slip is a distinct, fast signal on the pull request;
#                 jvm-build skips spotlessCheck so one slip does not turn two checks red.
#
#   web-build     Builds the Astro documentation site in web/ and stores it as an artifact,
#                 so every branch and pull request gets a browsable copy. Nothing else in the
#                 build compiles the site, so without this a broken doc would only surface at
#                 publish time.
#
#   examples      Builds, tests and runs every project under examples/. Each one is a standalone
#                 build against the *published* Skipper artifacts (not this checkout), so this job
#                 catches an example that has rotted, not a regression in the engine. It runs on a
#                 machine executor because two examples need Docker: Spring Boot's integration test
#                 boots MySQL through Testcontainers and its compose file is smoke-tested, and the
#                 Dropwizard service is smoke-tested against a MySQL container.
#
# Two more run on main only:
#
#   web-publish  Pushes the built site to the gh-pages branch, which GitHub Pages serves.
#
#   tag-release  Tags main with the version its commits imply (scripts/next-version.sh) once
#                jvm-build and format-check have passed, so landing a `fix:` or `feat:` pull
#                request produces its release tag without a manual step. Pushing the tag
#                triggers the `release` workflow below. Does nothing when no releasable
#                commit has landed since the last tag, or when the tag already exists.
#
# One more runs on release tags only:
#
#   publish-release  Publishes the tagged version of skipper-core, skipper-testutils and
#                    skipper-state-machine to Maven Central, the only place Skipper is published. Runs after jvm-build has passed on the same tag, so nothing
#                    untested is ever published. The deployment is left for a human to
#                    release in the Central Portal UI. Internal consumers get it from there:
#                    Artifactory's Central mirror serves it without any direct upload.
#
# Required context for publish-release (Organization Settings > Contexts), named
# `skipper-publish`. Restrict it to the group that owns releases; CircleCI does not expose
# contexts to builds from forked pull requests, so PR builds never see these:
#
#   ORG_GRADLE_PROJECT_mavenCentralUsername  Central Portal user token: username
#   ORG_GRADLE_PROJECT_mavenCentralPassword  Central Portal user token: password
#   SIGNING_KEY                              ASCII-armoured PGP private key
#   SIGNING_PASSWORD                         its passphrase
#
# Why the site is published from here rather than from GitHub Actions: the Actions model
# for Pages needs an OIDC token that only GitHub Actions can mint, and Actions does not run
# on this repository while it is private. The branch model needs only push access, which
# CircleCI can be given. See scripts/publish-web.sh.
#
# Required for web-publish, done once:
#
#   A deploy key with write access. Generate a keypair, add the public half under the
#   repository's Settings > Deploy keys with "Allow write access" checked, and add the
#   private half under Project Settings > SSH Keys > Additional SSH Keys for github.com.
#   The job pins that key's fingerprint, so replacing the key means updating it there too.
#   The deploy key CircleCI creates through its GitHub integration is read-only and will
#   not do - it is what every failed web-publish run was authenticating with.
#
# CircleCI cannot filter jobs by changed path without converting this to a dynamic setup
# workflow, so web-build runs even for a Gradle-only change. That is deliberate: the build
# is under a minute, and web-publish pushes nothing when the built site is unchanged, so an
# unrelated commit costs a build and no Pages deployment.
#
# Optional project environment variable (Project Settings > Environment Variables):
#
#   SKIPPER_ARTIFACTORY_MIRROR  Maven mirror URL. settings.gradle.kts puts it ahead
#                               of Maven Central for both plugins and dependencies,
#                               which avoids Central's 429 rate limits on shared CI
#                               egress IPs. The build works without it.

version: 2.1

executors:
  # JDK 17 matches the Gradle toolchain in build.gradle.kts. The build still emits
  # JVM 8 bytecode (`options.release = 8`, `jvmTarget = 1.8`), so no second JDK is
  # needed. Having 17 in the image also keeps Gradle from provisioning a toolchain
  # over the network.
  jvm:
    docker:
      - image: cimg/openjdk:17.0.20
    resource_class: medium
    working_directory: ~/skipper
    environment:
      # A long-lived daemon buys nothing in a single-use container. Two workers
      # matches the 2 vCPUs of `medium`.
      #
      # Memory: gradle.properties asks for -Xmx2g, and the Kotlin compile daemon is
      # a second JVM on top of that, inside medium's 4 GB. If compilation ever gets
      # OOM-killed, either raise resource_class or add
      # `-Pkotlin.daemon.jvmargs=-Xmx1g` to the Gradle invocation below.
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

  # Node 22 satisfies Astro 5's floor (18.20.8+, 20.3+, or 22+). Pinned to a full version
  # like the JDK image above, so a Node release never changes the build without a commit.
  node:
    docker:
      - image: cimg/node:22.20.0
    resource_class: small
    working_directory: ~/skipper

jobs:
  jvm-build-jackson:
    executor: jvm
    parameters:
      jackson_version:
        # Empty runs the suite on the Jackson Skipper compiles against (2.9.10, the version
        # catalog). Anything else is forced onto the runtime classpaths only, via
        # -PjacksonVersion in build.gradle.kts, so the same bytecode is tested on the Jackson a
        # host service may already ship. The workflow below runs one job per listed version.
        type: string
        default: ""
    steps:
      - checkout

      - restore_cache:
          name: Restore Gradle caches
          keys:
            # Exact match: same Gradle distribution, same declared dependencies.
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "build.gradle.kts" }}-{{ checksum "skipper-state-machine/build.gradle.kts" }}-{{ checksum "testutils/build.gradle.kts" }}
            # Partial match: same Gradle distribution, dependencies have moved. Still
            # saves the wrapper download and most of the module cache.
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-

      - run:
          name: Install embedded MariaDB native dependencies
          # MySqlWorkflowStoreTest and MySqlSchedulerTest boot a real server through
          # MariaDB4j, which unpacks the MariaDB 10.2.11 linux64 binaries it bundles.
          # Those are dynamically linked against libraries the base image does not
          # carry: mysqld needs libaio.so.1, and the mysql client MariaDB4j shells out
          # to (to create the test database) needs libncurses.so.5 and libnsl.so.1.
          # Without these the tests fail in @BeforeAll with
          # "An error occurred while installing the database".
          #
          # These package names are Ubuntu 22.04 (the cimg/openjdk:17.0.x base). On
          # 24.04 libaio1 became libaio1t64 and libncurses5 is gone entirely, so
          # revisit this step if the executor image is bumped past 22.04.
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libaio1 \
              libncurses5 \
              libnsl2

      - run:
          name: Build and test
          # spotlessCheck is excluded here because format-check runs it as its own job.
          command: |
            ARGS=""
            if [ -n "<< parameters.jackson_version >>" ]; then
              ARGS="-PjacksonVersion=<< parameters.jackson_version >>"
            fi
            ./gradlew --stacktrace build -x spotlessCheck $ARGS

      - run:
          name: Validate the publication metadata
          # Publishes to the local Maven cache, which needs no credentials and no network.
          # Catches a malformed POM or a broken publication config in review rather than at
          # release time, when the fix is far more expensive.
          command: ./gradlew publishToMavenLocal -PVERSION_NAME=0.0.0-CI

      - run:
          name: Drop Gradle lock files
          # Lock files are per-process state; caching them can wedge the next build.
          command: |
            find ~/.gradle -name '*.lock' -type f -delete || true
          when: always

      - save_cache:
          name: Save Gradle caches
          # Saved even when the build fails: the dependency download is the expensive
          # part and it is already done by the time anything can fail.
          key: gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "build.gradle.kts" }}-{{ checksum "skipper-state-machine/build.gradle.kts" }}-{{ checksum "testutils/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          when: always

      # store_test_results and store_artifacts run even when an earlier step failed,
      # so a red build still publishes its test report. The JUnit XML also drives
      # CircleCI's per-test timing and flaky-test detection.
      - store_test_results:
          path: build/test-results/test

      - store_test_results:
          path: skipper-state-machine/build/test-results/test
      - store_test_results:
          path: testutils/build/test-results/test

      # Browsable HTML test report.
      - store_artifacts:
          path: build/reports/tests/test
          destination: test-report

      - store_artifacts:
          path: skipper-state-machine/build/reports/tests/test
      - store_artifacts:
          path: testutils/build/reports/tests/test
          destination: test-report-state-machine

      - store_artifacts:
          path: build/libs
          destination: libs

      - store_artifacts:
          path: skipper-state-machine/build/libs
      - store_artifacts:
          path: testutils/build/libs
          destination: libs-state-machine

  # Fan-in for the build workflow. The main branch ruleset requires the status context
  # `ci/circleci: jvm-build`, which is the name the suite job had before it was run once per
  # Jackson version. Reporting that name from a job that requires every matrix entry keeps the
  # whole matrix (formatting and the examples too) merge-gating without touching the repository rules. It owns
  # the `jvm-build` key outright: a workflow-level `name:` that collides with another job's key
  # gets suffixed by CircleCI (`jvm-build-1`), which the ruleset would not match.
  jvm-build:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: All gating jobs passed
          command: echo "jvm-build matrix and format-check passed"

  examples:
    machine:
      # Docker and docker compose v2 are preinstalled; the JDK and Maven are not.
      image: ubuntu-2204:current
    resource_class: medium
    working_directory: ~/skipper
    environment:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - checkout

      - restore_cache:
          name: Restore the examples' Gradle and Maven caches
          keys:
            - examples-v1-{{ checksum "examples/java-gradle-sqlite/build.gradle.kts" }}-{{ checksum "examples/java-maven-sqlite/pom.xml" }}-{{ checksum "examples/kotlin-gradle-sqlite/build.gradle.kts" }}-{{ checksum "examples/spring-boot-mysql/build.gradle.kts" }}-{{ checksum "examples/dropwizard-mysql/build.gradle.kts" }}
            - examples-v1-

      - run:
          name: Install JDK 17
          # Every example declares a Java 17 toolchain, and Gradle 9 itself needs JVM 17+ to start. The
          # machine image ships an older default JDK, so install 17 and make it the JVM for every later
          # step through BASH_ENV rather than trusting `java` on PATH. Maven comes from the example's own
          # wrapper (mvnw), so nothing else is installed.
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openjdk-17-jdk-headless
            JAVA_HOME=$(dirname "$(dirname "$(readlink -f /usr/lib/jvm/java-17-openjdk-*/bin/java)")")
            echo "export JAVA_HOME=$JAVA_HOME" >> "$BASH_ENV"
            echo "export PATH=$JAVA_HOME/bin:\$PATH" >> "$BASH_ENV"
            "$JAVA_HOME/bin/java" -version
            docker version --format '{{.Server.Version}}'
            docker compose version

      - run:
          name: java-gradle-sqlite
          command: ./gradlew --stacktrace build run
          working_directory: ~/skipper/examples/java-gradle-sqlite

      - run:
          name: java-maven-sqlite
          command: |
            ./mvnw -B verify
            ./mvnw -B -q compile exec:java
          working_directory: ~/skipper/examples/java-maven-sqlite

      - run:
          name: kotlin-gradle-sqlite
          command: ./gradlew --stacktrace build run
          working_directory: ~/skipper/examples/kotlin-gradle-sqlite

      - run:
          name: spring-boot-mysql (Testcontainers integration test)
          command: ./gradlew --stacktrace build
          working_directory: ~/skipper/examples/spring-boot-mysql

      - run:
          name: spring-boot-mysql (docker compose smoke)
          # --wait blocks on both services' healthchecks, so the first request lands on a ready app.
          command: |
            docker compose up -d --build --wait
            curl -fsS -X POST localhost:8080/orders -H 'Content-Type: application/json' \
              -d '{"orderId":"ci-1","customerId":"alice","sku":"BOOK-1","quantity":2,"amountCents":3900}'
            for _ in $(seq 1 60); do
              body=$(curl -fsS localhost:8080/orders/ci-1)
              case "$body" in *'"instanceStatus":"COMPLETED"'*) echo "$body"; break;; esac
              sleep 1
            done
            case "$body" in *'"status":"FULFILLED"'*) echo "compose smoke passed";; *) echo "order never fulfilled: $body"; docker compose logs app; exit 1;; esac
          working_directory: ~/skipper/examples/spring-boot-mysql
      - run:
          name: spring-boot-mysql (compose down)
          command: docker compose down -v
          working_directory: ~/skipper/examples/spring-boot-mysql
          when: always

      - run:
          name: dropwizard-mysql (build and WorkflowTest)
          command: ./gradlew --stacktrace build
          working_directory: ~/skipper/examples/dropwizard-mysql

      - run:
          name: dropwizard-mysql (smoke against a MySQL container)
          command: |
            docker run -d --name orders-mysql -p 3306:3306 \
              -e MYSQL_DATABASE=orders -e MYSQL_USER=orders -e MYSQL_PASSWORD=orders -e MYSQL_ROOT_PASSWORD=root \
              mysql:8.4
            for _ in $(seq 1 60); do
              docker exec orders-mysql mysqladmin ping -h127.0.0.1 -uorders -porders >/dev/null 2>&1 && break
              sleep 2
            done
            scripts/smoke.sh config.yml
          working_directory: ~/skipper/examples/dropwizard-mysql
      - run:
          name: dropwizard-mysql (stop MySQL)
          command: docker rm -f orders-mysql || true
          when: always

      - run:
          name: Drop Gradle lock files
          command: find ~/.gradle -name '*.lock' -type f -delete || true
          when: always
      - save_cache:
          name: Save the examples' Gradle and Maven caches
          key: examples-v1-{{ checksum "examples/java-gradle-sqlite/build.gradle.kts" }}-{{ checksum "examples/java-maven-sqlite/pom.xml" }}-{{ checksum "examples/kotlin-gradle-sqlite/build.gradle.kts" }}-{{ checksum "examples/spring-boot-mysql/build.gradle.kts" }}-{{ checksum "examples/dropwizard-mysql/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
            - ~/.m2/repository
          when: always

      - store_test_results:
          path: examples/java-gradle-sqlite/build/test-results/test
      - store_test_results:
          path: examples/java-maven-sqlite/target/surefire-reports
      - store_test_results:
          path: examples/kotlin-gradle-sqlite/build/test-results/test
      - store_test_results:
          path: examples/spring-boot-mysql/build/test-results/test
      - store_test_results:
          path: examples/dropwizard-mysql/build/test-results/test
      - store_artifacts:
          path: examples/dropwizard-mysql/smoke-server.log
          destination: dropwizard-smoke-server.log

  format-check:
    # Reuses the JDK 17 image: Spotless and both formatters are JVM tools, and
    # google-java-format 1.26 needs a JDK 17 or newer. Nothing here compiles anything.
    executor: jvm
    steps:
      - checkout

      - restore_cache:
          name: Restore Gradle caches
          # Same keys as jvm-build: the formatter jars are ordinary Gradle dependencies, so a
          # cache jvm-build saved already holds them.
          keys:
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "build.gradle.kts" }}-{{ checksum "skipper-state-machine/build.gradle.kts" }}-{{ checksum "testutils/build.gradle.kts" }}
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-

      - run:
          name: Check Kotlin and Java formatting
          command: ./gradlew --stacktrace spotlessCheck

  web-build:
    executor: node
    steps:
      - checkout

      - restore_cache:
          name: Restore the npm cache
          keys:
            - npm-v1-{{ checksum "web/package-lock.json" }}
            # Partial match: dependencies have moved, but most of the cache still applies.
            - npm-v1-

      - run:
          name: Install web dependencies
          # `ci`, not `install`: fails on a lock file that has drifted from package.json
          # rather than quietly resolving something else.
          command: npm ci
          working_directory: ~/skipper/web

      - save_cache:
          name: Save the npm cache
          key: npm-v1-{{ checksum "web/package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Build the site
          command: npm run build
          working_directory: ~/skipper/web
          environment:
            # The site is served from the root of the custom domain in web/public/CNAME,
            # not from a /<repo>/ project path, so no base path is set. astro.config.mjs
            # defaults to this same value; it is repeated here so the deployed origin is
            # visible in the job that publishes it.
            SKIPPER_SITE_URL: https://skipper.airbnb.tech

      - persist_to_workspace:
          # web-publish pushes exactly these bytes. Rebuilding there would risk publishing
          # something no job ever checked.
          root: ~/skipper
          paths:
            - web/dist

      # A browsable copy of the site on every build, pull requests included - and the only
      # preview available at all while Pages cannot serve this repository.
      - store_artifacts:
          path: web/dist
          destination: web

  web-publish:
    executor: node
    environment:
      # Push over SSH explicitly rather than reusing whatever URL `checkout` left in
      # `origin`. CircleCI's GitHub App integration checks out over HTTPS with a token that
      # cannot push, and which integration a project uses is not visible from here.
      SKIPPER_PAGES_REMOTE: git@github.com:airbnb/skipper.git
    steps:
      - checkout

      # Pinned to the write-access deploy key. Without a fingerprint CircleCI offers every
      # key on the project and SSH leads with the auto-created read-only checkout key,
      # which GitHub accepts for authentication and then rejects for the push ("The key
      # you are authenticating with has been marked as read only"). Pinning makes this
      # key the only identity offered to github.com. Rotating the key means updating
      # this fingerprint.
      - add_ssh_keys:
          fingerprints:
            - "SHA256:vaTKb0KMOiHkGqSQ4/jL7alxnIDoUGkTS5CC63LRI3E"

      - run:
          name: Trust GitHub's SSH host keys
          # `checkout` populates known_hosts only on the SSH integration, and the push
          # above may be the job's first SSH connection. Reading the keys from the
          # TLS-authenticated meta API works under either integration and hardcodes nothing
          # that GitHub might rotate.
          command: |
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            curl -fsSL https://api.github.com/meta \
              | jq -r '.ssh_keys[] | "github.com \(.)"' >> ~/.ssh/known_hosts

      - attach_workspace:
          at: ~/skipper

      - run:
          name: Publish the site to gh-pages
          command: ./scripts/publish-web.sh

  tag-release:
    executor: jvm
    steps:
      - checkout
      - run:
          name: Work out the version this main implies
          # `git describe` needs the tags, and CircleCI's checkout may leave them out.
          command: |
            git fetch --tags --quiet origin
            if V=$(scripts/next-version.sh); then
              echo "export RELEASE_VERSION=$V" >> "$BASH_ENV"
              echo "main implies $V"
            else
              echo "Nothing releasable has landed since the last tag; not tagging."
              circleci-agent step halt
            fi
      # Same write-access deploy key web-publish pushes with; see the comment there for why the
      # fingerprint is pinned.
      - add_ssh_keys:
          fingerprints:
            - "SHA256:vaTKb0KMOiHkGqSQ4/jL7alxnIDoUGkTS5CC63LRI3E"
      - run:
          name: Trust GitHub's SSH host keys
          command: |
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            curl -fsSL https://api.github.com/meta \
              | jq -r '.ssh_keys[] | "github.com \(.)"' >> ~/.ssh/known_hosts
      - run:
          name: Tag the release
          # Re-running this job, or two pipelines racing on main, must not fail on a tag that
          # already exists: the first push wins and the rest are no-ops.
          command: |
            TAG="v$RELEASE_VERSION"
            REMOTE=git@github.com:airbnb/skipper.git
            if git ls-remote --exit-code --tags "$REMOTE" "refs/tags/$TAG" >/dev/null; then
              echo "$TAG already exists; nothing to do."
              exit 0
            fi
            git config user.name "skipper-ci"
            git config user.email "skipper-ci@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $RELEASE_VERSION"
            git push "$REMOTE" "refs/tags/$TAG"
            echo "Pushed $TAG; the release workflow takes it from here."

  publish-release:
    executor: jvm
    steps:
      - checkout

      - restore_cache:
          name: Restore Gradle caches
          keys:
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "build.gradle.kts" }}-{{ checksum "skipper-state-machine/build.gradle.kts" }}-{{ checksum "testutils/build.gradle.kts" }}
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-

      - run:
          name: Check the release context is attached
          # A missing context surfaces here as one clear line rather than as a Gradle
          # credentials error several minutes into the upload.
          command: |
            missing=""
            for v in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword SIGNING_KEY SIGNING_PASSWORD; do
              [ -n "${!v:-}" ] || missing="$missing $v"
            done
            if [ -n "$missing" ]; then
              echo "Not set:$missing"
              echo "Add them to the skipper-publish context (see the header of this file)."
              exit 1
            fi

      - run:
          name: Publish the tagged release to Maven Central
          # The tag is the version, minus the leading `v`. Uploads a signed bundle and waits
          # for Central's validation; the deployment then sits in the Portal until someone
          # releases it. Central refuses to overwrite an existing version, so re-running an
          # already-published tag fails rather than silently replacing the artifact.
          command: |
            VERSION="${CIRCLE_TAG#v}"
            echo "Publishing com.airbnb.skipper skipper-core, skipper-testutils and skipper-state-machine $VERSION to Maven Central"
            ./gradlew --stacktrace publishToMavenCentral -PVERSION_NAME="$VERSION"

workflows:
  build:
    jobs:
      # The default build, on the Jackson Skipper compiles against. Named explicitly because the
      # matrix below is the same job, and a bare job key in a `requires` would be ambiguous.
      - jvm-build-jackson:
          name: jvm-build-jackson-2.9.10
      # Same job, once per Jackson line a host is likely to run. Add a version to the list to
      # cover it (and to the jvm-build gate's requires); keep the newest 2.x last and bump it as Jackson releases.
      - jvm-build-jackson:
          name: jvm-build-jackson-<< matrix.jackson_version >>
          matrix:
            parameters:
              jackson_version: ["2.13.5", "2.17.3", "2.22.2"]
      - format-check
      - examples
      - jvm-build:
          requires:
            - jvm-build-jackson-2.9.10
            - jvm-build-jackson-2.13.5
            - jvm-build-jackson-2.17.3
            - jvm-build-jackson-2.22.2
            - format-check
            - examples
      - web-build
      - web-publish:
          requires:
            - web-build
          # main only: a pull request must not overwrite the published site. The build
          # still runs on every branch, so a broken site is caught before merge.
          filters:
            branches:
              only: main
      - tag-release:
          requires:
            - jvm-build
          # main only: the tag is the release record, so it is only ever cut from a merged,
          # tested main. The tag push then starts the `release` workflow below.
          filters:
            branches:
              only: main

  # Tag-triggered, so a release is re-runnable against an immutable ref and a maintainer can
  # cut one by pushing a tag with no CI change. jvm-build runs again here: redundant for a tag
  # on an already-tested commit, but it is what makes a hand-pushed tag safe. CircleCI does
  # not run a workflow on a tag unless its jobs carry tag filters, so `build` above is
  # unaffected by tag pushes.
  release:
    jobs:
      # The suite on the Jackson Skipper compiles against; the release does not repeat the matrix.
      - jvm-build-jackson:
          name: jvm-build-jackson-2.9.10
          filters: &release-tags
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
      - publish-release:
          requires:
            - jvm-build-jackson-2.9.10
          context:
            - skipper-publish
          filters: *release-tags
