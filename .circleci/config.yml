# CircleCI configuration for airbnb/skipper.
#
# Jobs:
#
#   jvm-build         Gradle: compiles the engine (Kotlin + Java, joint compilation) plus
#                     the skipper-state-machine plugin module, and runs both test subsets.
#                     A bare `gradlew build` from the root covers every project.
#   publish-snapshot  DEFINED BUT NOT WIRED. See "Publishing" below.
#   publish-release   DEFINED BUT NOT WIRED. See "Publishing" below.
#
# Publishing
# ----------
# Releases are published manually; see RELEASING.md. The two publish jobs below are ready
# but deliberately not referenced by any workflow. To enable automated publishing, uncomment
# the entries at the bottom of this file and provide the `maven-publish` context below.
#
# Required context (Organization Settings > Contexts), named `maven-publish`. Restrict it to
# the group that owns releases; CircleCI does not expose contexts to builds from forked pull
# requests, so PR builds never see these.
#
# The Artifactory hostnames live in the context alongside the credentials rather than in
# this file, since this repository is public:
#
#   ORG_GRADLE_PROJECT_SNAPSHOT_REPOSITORY_URL  destination for -SNAPSHOT versions
#   ORG_GRADLE_PROJECT_RELEASE_REPOSITORY_URL   destination for release versions
#   ORG_GRADLE_PROJECT_artifactoryUsername      repository username
#   ORG_GRADLE_PROJECT_artifactoryPassword      repository password or API token
#
# Optional project environment variable (Project Settings > Environment Variables):
#
#   SKIPPER_ARTIFACTORY_MIRROR  Maven mirror URL. settings.gradle.kts puts it ahead
#                               of Maven Central for both plugins and dependencies,
#                               which avoids Central's 429 rate limits on shared CI
#                               egress IPs. The build works without it.

version: 2.1

executors:
  # JDK 17 matches the Gradle toolchain in build.gradle.kts. The build still emits
  # JVM 8 bytecode (`options.release = 8`, `jvmTarget = 1.8`), so no second JDK is
  # needed. Having 17 in the image also keeps Gradle from provisioning a toolchain
  # over the network.
  jvm:
    docker:
      - image: cimg/openjdk:17.0.20
    resource_class: medium
    working_directory: ~/skipper
    environment:
      # A long-lived daemon buys nothing in a single-use container. Two workers
      # matches the 2 vCPUs of `medium`.
      #
      # Memory: gradle.properties asks for -Xmx2g, and the Kotlin compile daemon is
      # a second JVM on top of that, inside medium's 4 GB. If compilation ever gets
      # OOM-killed, either raise resource_class or add
      # `-Pkotlin.daemon.jvmargs=-Xmx1g` to the Gradle invocation below.
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

commands:
  restore_gradle_cache:
    steps:
      - restore_cache:
          name: Restore Gradle caches
          keys:
            # Exact match: same Gradle distribution, same declared dependencies.
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "build.gradle.kts" }}-{{ checksum "skipper-state-machine/build.gradle.kts" }}
            # Partial match: same Gradle distribution, dependencies have moved. Still
            # saves the wrapper download and most of the module cache.
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-

  save_gradle_cache:
    steps:
      - run:
          name: Drop Gradle lock files
          # Lock files are per-process state; caching them can wedge the next build.
          command: |
            find ~/.gradle -name '*.lock' -type f -delete || true
          when: always
      - save_cache:
          name: Save Gradle caches
          # Saved even when the build fails: the dependency download is the expensive
          # part and it is already done by the time anything can fail.
          key: gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "build.gradle.kts" }}-{{ checksum "skipper-state-machine/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          when: always

jobs:
  jvm-build:
    executor: jvm
    steps:
      - checkout
      - restore_gradle_cache

      - run:
          name: Install embedded MariaDB native dependencies
          # MySqlWorkflowStoreTest and MySqlSchedulerTest boot a real server through
          # MariaDB4j, which unpacks the MariaDB 10.2.11 linux64 binaries it bundles.
          # Those are dynamically linked against libraries the base image does not
          # carry: mysqld needs libaio.so.1, and the mysql client MariaDB4j shells out
          # to (to create the test database) needs libncurses.so.5 and libnsl.so.1.
          # Without these the tests fail in @BeforeAll with
          # "An error occurred while installing the database".
          #
          # These package names are Ubuntu 22.04 (the cimg/openjdk:17.0.x base). On
          # 24.04 libaio1 became libaio1t64 and libncurses5 is gone entirely, so
          # revisit this step if the executor image is bumped past 22.04.
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libaio1 \
              libncurses5 \
              libnsl2

      - run:
          name: Build and test
          command: ./gradlew --stacktrace build

      - run:
          name: Validate the publication metadata
          # Publishes to the local Maven cache, which needs no credentials. Catches a
          # malformed POM or a broken publication config in review rather than at
          # release time, when the fix is far more expensive.
          command: ./gradlew publishToMavenLocal -PVERSION_NAME=0.0.0-CI

      - save_gradle_cache

      # store_test_results and store_artifacts run even when an earlier step failed,
      # so a red build still publishes its test report. The JUnit XML also drives
      # CircleCI's per-test timing and flaky-test detection.
      - store_test_results:
          path: build/test-results/test

      - store_test_results:
          path: skipper-state-machine/build/test-results/test

      # Browsable HTML test report.
      - store_artifacts:
          path: build/reports/tests/test
          destination: test-report

      - store_artifacts:
          path: skipper-state-machine/build/reports/tests/test
          destination: test-report-state-machine

      - store_artifacts:
          path: build/libs
          destination: libs

      - store_artifacts:
          path: skipper-state-machine/build/libs
          destination: libs-state-machine
  publish-snapshot:
    executor: jvm
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Publish snapshot to Artifactory
          # --snapshot means the script always yields a version, even when only docs or
          # chores landed. Snapshots are prunable, so there is no gate here; only real
          # releases are gated, and those are cut by pushing a tag.
          command: |
            if [ -z "${ORG_GRADLE_PROJECT_SNAPSHOT_REPOSITORY_URL:-}" ]; then
              echo "ORG_GRADLE_PROJECT_SNAPSHOT_REPOSITORY_URL is not set."
              echo "Add it to the maven-publish context (see the header of this file)."
              exit 1
            fi
            VERSION="$(scripts/next-version.sh --snapshot)-SNAPSHOT"
            echo "Publishing com.airbnb.skipper:skipper-core:$VERSION"
            ./gradlew --stacktrace publishAllPublicationsToArtifactoryRepository \
              -PVERSION_NAME="$VERSION"
      - save_gradle_cache

  publish-release:
    executor: jvm
    steps:
      - checkout
      - restore_gradle_cache
      - run:
          name: Publish the tagged release to Artifactory
          # The tag is the version, minus the leading `v`. Artifactory refuses to
          # overwrite an existing release version, so a re-run of an already-published
          # tag fails rather than silently replacing the artifact.
          command: |
            if [ -z "${ORG_GRADLE_PROJECT_RELEASE_REPOSITORY_URL:-}" ]; then
              echo "ORG_GRADLE_PROJECT_RELEASE_REPOSITORY_URL is not set."
              echo "Add it to the maven-publish context (see the header of this file)."
              exit 1
            fi
            VERSION="${CIRCLE_TAG#v}"
            echo "Publishing com.airbnb.skipper:skipper-core:$VERSION"
            ./gradlew --stacktrace publishAllPublicationsToArtifactoryRepository \
              -PVERSION_NAME="$VERSION"
      - save_gradle_cache

workflows:
  build:
    jobs:
      # Tag pushes are handled by the release workflow below, not this one.
      - jvm-build:
          filters:
            tags:
              ignore: /.*/
      # Not wired yet - see "Publishing" in the header. To enable, uncomment:
      #
      # - publish-snapshot:
      #     requires:
      #       - jvm-build
      #     context:
      #       - maven-publish
      #     filters:
      #       branches:
      #         only: main

  # A tag-triggered release is re-runnable against an immutable ref, and lets a
  # maintainer cut a release by hand without touching CI config. jvm-build runs again
  # here: redundant for a tag on an already-tested commit, but it is what makes a
  # hand-pushed tag safe.
  release:
    jobs:
      - jvm-build:
          filters: &release-tags
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
      # Not wired yet - see "Publishing" in the header. To enable, uncomment:
      #
      # - publish-release:
      #     requires:
      #       - jvm-build
      #     context:
      #       - maven-publish
      #     filters: *release-tags
