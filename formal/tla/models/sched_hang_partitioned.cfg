\* Scheduler: as sched_hang_spare with task partitioning on. The full instance keeps its
\* buckets, so their tasks wait for good next to an idle instance.
\* spec: SkipperScheduler
\* expect: temporal
SPECIFICATION Spec
CONSTANTS
    NTasks = 2
    NInstances = 2
    NBuckets = 2
    Limit = 1
    FetchSize = 2
    Partitioning = TRUE
    InMemTasks = {}
    Faults = {"hang"}
    MaxFaults = 0
    MaxHangs = 1
INVARIANTS TypeOK AdmittedMatchesWork IdleMeansZero FetchedWithinLimit NoFetchedWaitsWhileFull
PROPERTIES DueEventuallyRuns EveryTaskCompletes
CHECK_DEADLOCK FALSE
