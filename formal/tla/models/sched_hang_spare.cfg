\* Scheduler: as sched_hang with a second instance and no partitioning. The second instance
\* runs what the full one cannot.
\* spec: SkipperScheduler
\* expect: ok
SPECIFICATION Spec
CONSTANTS
    NTasks = 2
    NInstances = 2
    NBuckets = 2
    Limit = 1
    FetchSize = 2
    Partitioning = FALSE
    InMemTasks = {}
    Faults = {"hang"}
    MaxFaults = 0
    MaxHangs = 1
INVARIANTS TypeOK AdmittedMatchesWork IdleMeansZero FetchedWithinLimit NoFetchedWaitsWhileFull
PROPERTIES DueEventuallyRuns EveryTaskCompletes
CHECK_DEADLOCK FALSE
