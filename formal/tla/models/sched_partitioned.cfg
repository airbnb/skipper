\* Scheduler: task partitioning on. An instance may crash and restart, and a live instance's
\* heartbeat may age out, so bucket ranges move while tasks are due.
\* spec: SkipperScheduler
\* expect: ok
SPECIFICATION Spec
CONSTANTS
    NTasks = 2
    NInstances = 2
    NBuckets = 2
    Limit = 1
    FetchSize = 2
    Partitioning = TRUE
    InMemTasks = {}
    Faults = {"crash", "member_lapse"}
    MaxFaults = 2
    MaxHangs = 0
INVARIANTS TypeOK AdmittedMatchesWork IdleMeansZero FetchedWithinLimit NoFetchedWaitsWhileFull
PROPERTIES DueEventuallyRuns EveryTaskCompletes BucketsEventuallyOwned
CHECK_DEADLOCK FALSE
