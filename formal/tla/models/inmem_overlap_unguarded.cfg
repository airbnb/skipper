\* Calibration for inmem_overlap: the in-memory path queues its copy even when the backstop write
\* honoured a lease.
\* expect: NoOverlappingRuns
SPECIFICATION Spec
CONSTANTS
    Workers = {p1, p2}
    NWaits = 1
    MaxRetries = 4
    MaxSignals = 1
    MaxFaults = 0
    MaxRenewals = 1
    MaxRequeues = 0
    Faults = {}
    NoopOnExisting = FALSE
    BumpOnHonoredLease = TRUE
    UserFailures = FALSE
    InMemoryStart = TRUE
    SignalInMemory = TRUE
    MaxStartCalls = 1
    FreeBody = FALSE
    Callers = {c1, c2}
    RecoverAfterLease = TRUE
    NoLongPauses = TRUE
    InMemoryHonorsLease = FALSE
INVARIANTS TypeOK RunningIsDriven WaitingIsDriven NoOverlappingRuns
PROPERTIES TerminalIsStable TimerSchedulesKeepLeases EventuallyDone
CHECK_DEADLOCK FALSE
