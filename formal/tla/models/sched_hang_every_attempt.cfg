\* Scheduler: two instances with a limit of 1, no partitioning, and one task whose handler hangs on
\* every attempt. Each rerun after its lease lapses takes one more slot, until none is left.
\* spec: SkipperScheduler
\* expect: temporal
SPECIFICATION Spec
CONSTANTS
    NTasks = 1
    NInstances = 2
    NBuckets = 2
    Limit = 1
    FetchSize = 2
    Partitioning = FALSE
    InMemTasks = {}
    Faults = {"hang"}
    MaxFaults = 0
    MaxHangs = 2
INVARIANTS TypeOK AdmittedMatchesWork IdleMeansZero FetchedWithinLimit NoFetchedWaitsWhileFull
PROPERTIES DueEventuallyRuns EveryTaskCompletes
CHECK_DEADLOCK FALSE
