\* Handler timeouts and early lease expiry with two workers.
\* expect: RunningIsDriven
SPECIFICATION Spec
CONSTANTS
    Workers = {p1, p2}
    NWaits = 1
    MaxRetries = 4
    MaxSignals = 1
    MaxFaults = 1
    MaxRenewals = 1
    MaxRequeues = 0
    Faults = {"timeout", "early_expiry"}
    NoopOnExisting = TRUE
    BumpOnHonoredLease = TRUE
    UserFailures = FALSE
    InMemoryStart = FALSE
    SignalInMemory = FALSE
    MaxStartCalls = 1
    FreeBody = FALSE
    Callers = {c1}
    RecoverAfterLease = TRUE
    NoLongPauses = FALSE
    InMemoryHonorsLease = TRUE
INVARIANTS TypeOK RunningIsDriven WaitingIsDriven
PROPERTIES TerminalIsStable TimerSchedulesKeepLeases EventuallyDone
CHECK_DEADLOCK FALSE
