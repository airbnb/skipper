\* Handler timeouts and early lease expiry with two workers.
\* expect: RunningIsDriven
SPECIFICATION Spec
CONSTANTS
    Workers = {p1, p2}
    NWaits = 1
    MaxRetries = 4
    MaxSignals = 1
    MaxFaults = 1
    MaxRenewals = 1
    MaxRequeues = 0
    Faults = {"timeout", "early_expiry"}
    NoopOnExisting = TRUE
    BumpOnHonoredLease = TRUE
    UserFailures = FALSE
    InMemoryStart = FALSE
INVARIANTS TypeOK RunningIsDriven WaitingIsDriven
PROPERTIES TerminalIsStable EventuallyDone
CHECK_DEADLOCK FALSE
