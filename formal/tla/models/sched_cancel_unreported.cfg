\* Scheduler: the renewer cancels a run after it started its handler and before it reported the
\* handler's future. The slot is given back while the handler runs on.
\* spec: SkipperScheduler
\* expect: AdmittedMatchesWork
SPECIFICATION Spec
CONSTANTS
    NTasks = 2
    NInstances = 2
    NBuckets = 2
    Limit = 1
    FetchSize = 2
    Partitioning = FALSE
    InMemTasks = {}
    Faults = {"lapse", "cancel_unreported"}
    MaxFaults = 1
    MaxHangs = 0
INVARIANTS TypeOK AdmittedMatchesWork
CHECK_DEADLOCK FALSE
