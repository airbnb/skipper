\* Scheduler: as sched_inmem, asking that the whole count stay within the limit. It does not:
\* in-memory executions are never refused (calibration).
\* spec: SkipperScheduler
\* expect: AdmittedWithinLimit
SPECIFICATION Spec
CONSTANTS
    NTasks = 3
    NInstances = 2
    NBuckets = 2
    Limit = 1
    FetchSize = 2
    Partitioning = FALSE
    InMemTasks = {1}
    Faults = {}
    MaxFaults = 0
    MaxHangs = 0
INVARIANTS AdmittedWithinLimit
CHECK_DEADLOCK FALSE
