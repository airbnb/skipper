\* Two in-process starts of the same workflow from different JVMs, either of which may fail after
\* creating the row: the second can find the workflow RUNNING with no task while the first is
\* still about to schedule it. Assumes no start or queued copy stalls for a lease.
\* expect: ok
SPECIFICATION Spec
CONSTANTS
    Workers = {p1, p2}
    NWaits = 1
    MaxRetries = 4
    MaxSignals = 0
    MaxFaults = 1
    MaxRenewals = 1
    MaxRequeues = 0
    Faults = {"caller_fail"}
    NoopOnExisting = TRUE
    BumpOnHonoredLease = TRUE
    UserFailures = FALSE
    InMemoryStart = TRUE
    SignalInMemory = FALSE
    MaxStartCalls = 1
    FreeBody = FALSE
    Callers = {c1, c2}
    RecoverAfterLease = TRUE
    NoLongPauses = TRUE
INVARIANTS TypeOK RunningIsDriven WaitingIsDriven NoOverlappingRuns
PROPERTIES TerminalIsStable TimerSchedulesKeepLeases EventuallyDone
CHECK_DEADLOCK FALSE
