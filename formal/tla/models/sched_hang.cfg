\* Scheduler: one instance with a limit of 1 and one handler that never completes. Its slot is
\* held for good, so the other task is never fetched (the documented trade-off).
\* spec: SkipperScheduler
\* expect: temporal
SPECIFICATION Spec
CONSTANTS
    NTasks = 2
    NInstances = 1
    NBuckets = 2
    Limit = 1
    FetchSize = 2
    Partitioning = FALSE
    InMemTasks = {}
    Faults = {"hang"}
    MaxFaults = 0
    MaxHangs = 1
INVARIANTS TypeOK AdmittedMatchesWork IdleMeansZero FetchedWithinLimit NoFetchedWaitsWhileFull
PROPERTIES DueEventuallyRuns EveryTaskCompletes
CHECK_DEADLOCK FALSE
