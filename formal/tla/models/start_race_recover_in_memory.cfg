\* As start_race, with the stranded start scheduled like any other start, in memory: the honoured
\* lease alone keeps the two starts from both queueing a copy.
\* expect: ok
SPECIFICATION Spec
CONSTANTS
    Workers = {p1, p2}
    NWaits = 1
    MaxRetries = 4
    MaxSignals = 0
    MaxFaults = 1
    MaxRenewals = 1
    MaxRequeues = 0
    Faults = {"caller_fail"}
    NoopOnExisting = TRUE
    BumpOnHonoredLease = TRUE
    UserFailures = FALSE
    InMemoryStart = TRUE
    SignalInMemory = FALSE
    MaxStartCalls = 1
    FreeBody = FALSE
    Callers = {c1, c2}
    RecoverAfterLease = FALSE
    NoLongPauses = TRUE
    InMemoryHonorsLease = TRUE
INVARIANTS TypeOK RunningIsDriven WaitingIsDriven NoOverlappingRuns
PROPERTIES TerminalIsStable TimerSchedulesKeepLeases EventuallyDone
CHECK_DEADLOCK FALSE
