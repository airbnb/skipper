\* Calibration for start_race: the stranded start is scheduled like any other start.
\* expect: NoOverlappingRuns
SPECIFICATION Spec
CONSTANTS
    Workers = {p1, p2}
    NWaits = 1
    MaxRetries = 4
    MaxSignals = 0
    MaxFaults = 1
    MaxRenewals = 1
    MaxRequeues = 0
    Faults = {"caller_fail"}
    NoopOnExisting = TRUE
    BumpOnHonoredLease = TRUE
    UserFailures = FALSE
    InMemoryStart = TRUE
    SignalInMemory = FALSE
    MaxStartCalls = 1
    FreeBody = FALSE
    Callers = {c1, c2}
    RecoverAfterLease = FALSE
    NoLongPauses = TRUE
INVARIANTS TypeOK RunningIsDriven WaitingIsDriven NoOverlappingRuns
PROPERTIES TerminalIsStable TimerSchedulesKeepLeases EventuallyDone
CHECK_DEADLOCK FALSE
