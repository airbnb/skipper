\* Two JVMs start the same workflow in process with CREATE_EXISTING_WORKFLOW_IS_NOOP off, and a
\* signal takes the in-process path: a schedule that honours a lease queues no copy. Assumes no
\* queued copy waits for a lease.
\* expect: ok
SPECIFICATION Spec
CONSTANTS
    Workers = {p1, p2}
    NWaits = 1
    MaxRetries = 4
    MaxSignals = 1
    MaxFaults = 0
    MaxRenewals = 1
    MaxRequeues = 0
    Faults = {}
    NoopOnExisting = FALSE
    BumpOnHonoredLease = TRUE
    UserFailures = FALSE
    InMemoryStart = TRUE
    SignalInMemory = TRUE
    MaxStartCalls = 1
    FreeBody = FALSE
    Callers = {c1, c2}
    RecoverAfterLease = TRUE
    NoLongPauses = TRUE
    InMemoryHonorsLease = TRUE
INVARIANTS TypeOK RunningIsDriven WaitingIsDriven NoOverlappingRuns
PROPERTIES TerminalIsStable TimerSchedulesKeepLeases EventuallyDone
CHECK_DEADLOCK FALSE
