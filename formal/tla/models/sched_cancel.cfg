\* Scheduler: limit 1, and a lease that lapses under a task an instance still holds, so the other
\* instance fetches it and the renewer cancels the first one's run, whatever point it has reached.
\* spec: SkipperScheduler
\* expect: ok
SPECIFICATION Spec
CONSTANTS
    NTasks = 2
    NInstances = 2
    NBuckets = 2
    Limit = 1
    FetchSize = 2
    Partitioning = FALSE
    InMemTasks = {}
    Faults = {"lapse"}
    MaxFaults = 1
    MaxHangs = 0
INVARIANTS TypeOK AdmittedMatchesWork IdleMeansZero FetchedWithinLimit NoFetchedWaitsWhileFull
PROPERTIES DueEventuallyRuns EveryTaskCompletes
CHECK_DEADLOCK FALSE
