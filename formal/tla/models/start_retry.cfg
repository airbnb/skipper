\* startWorkflow fails after creating the row and the caller retries, CREATE_EXISTING_WORKFLOW_IS_NOOP on (default).
\* expect: RunningIsDriven
SPECIFICATION Spec
CONSTANTS
    Workers = {p1}
    NWaits = 1
    MaxRetries = 4
    MaxSignals = 0
    MaxFaults = 1
    MaxRenewals = 1
    MaxRequeues = 0
    Faults = {"caller_fail"}
    NoopOnExisting = TRUE
    BumpOnHonoredLease = TRUE
    UserFailures = FALSE
    InMemoryStart = FALSE
INVARIANTS TypeOK RunningIsDriven WaitingIsDriven
PROPERTIES TerminalIsStable EventuallyDone
CHECK_DEADLOCK FALSE
