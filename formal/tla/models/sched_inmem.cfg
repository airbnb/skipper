\* Scheduler: one task enters through an in-memory schedule on either instance, next to two
\* due tasks, with a limit of 1.
\* spec: SkipperScheduler
\* expect: ok
SPECIFICATION Spec
CONSTANTS
    NTasks = 3
    NInstances = 2
    NBuckets = 2
    Limit = 1
    FetchSize = 2
    Partitioning = FALSE
    InMemTasks = {1}
    Faults = {}
    MaxFaults = 0
    MaxHangs = 0
INVARIANTS TypeOK AdmittedMatchesWork IdleMeansZero FetchedWithinLimit NoFetchedWaitsWhileFull
PROPERTIES DueEventuallyRuns EveryTaskCompletes
CHECK_DEADLOCK FALSE
