\* In-process startWorkflow with default gates and no faults: the in-memory copy can outlive its lease.
\* expect: RunningIsDriven
SPECIFICATION Spec
CONSTANTS
    Workers = {p1, p2}
    NWaits = 1
    MaxRetries = 4
    MaxSignals = 1
    MaxFaults = 0
    MaxRenewals = 1
    MaxRequeues = 0
    Faults = {}
    NoopOnExisting = TRUE
    BumpOnHonoredLease = TRUE
    UserFailures = FALSE
    InMemoryStart = TRUE
    SignalInMemory = FALSE
    MaxStartCalls = 1
    FreeBody = FALSE
INVARIANTS TypeOK RunningIsDriven WaitingIsDriven
PROPERTIES TerminalIsStable EventuallyDone
CHECK_DEADLOCK FALSE
