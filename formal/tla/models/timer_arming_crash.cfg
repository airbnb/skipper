\* A worker crashes somewhere while running the workflow.
\* expect: WaitingIsDriven
SPECIFICATION Spec
CONSTANTS
    Workers = {p1}
    NWaits = 1
    MaxRetries = 4
    MaxSignals = 0
    MaxFaults = 1
    MaxRenewals = 1
    MaxRequeues = 0
    Faults = {"crash"}
    NoopOnExisting = TRUE
    BumpOnHonoredLease = TRUE
    UserFailures = FALSE
    InMemoryStart = FALSE
INVARIANTS TypeOK RunningIsDriven WaitingIsDriven
PROPERTIES TerminalIsStable EventuallyDone
CHECK_DEADLOCK FALSE
