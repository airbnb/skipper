\* A timer task goes missing, then a lease lapses under a live holder, so two executions
\* schedule the same timer's task concurrently. Checks only that no timer schedule replaces
\* a leased task: with early expiry on, WaitingIsDriven already fails through finding 3 (the ABA
\* version reuse), which lease_faults records.
\* expect: ok
SPECIFICATION Spec
CONSTANTS
    Workers = {p1, p2}
    NWaits = 1
    MaxRetries = 4
    MaxSignals = 0
    MaxFaults = 2
    MaxRenewals = 1
    MaxRequeues = 0
    Faults = {"store_error", "early_expiry"}
    NoopOnExisting = TRUE
    BumpOnHonoredLease = TRUE
    UserFailures = FALSE
    InMemoryStart = FALSE
    SignalInMemory = FALSE
    MaxStartCalls = 1
    FreeBody = FALSE
INVARIANTS TypeOK
PROPERTIES TerminalIsStable TimerSchedulesKeepLeases
CHECK_DEADLOCK FALSE
