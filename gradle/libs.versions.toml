# Skipper Gradle version catalog.
#
# Dependency versions for the OSS build. A few libraries are pinned deliberately:
# kotlin 1.9.25 (matching the standard pin; the Maven Central publishing plugin needs
# 1.9.20+), jackson 2.9.10, and guava 33.5.0-jre. vavr tracks 0.10.4, matching the
# standard pin. The remaining libraries track their standard pins. Keep this file in
# sync when those change.

[versions]
kotlin = "1.9.25"
kotlinxCoroutines = "1.8.1"
jackson = "2.9.10"
guava = "33.5.0-jre"
vavr = "0.10.4"
slf4j = "2.0.7"
flyway = "5.0.7"
sqliteJdbc = "3.45.3.0"
libthrift = "0.9.3"
javassist = "3.25.0-GA"
opentracing = "0.33.0"
javaxInject = "1"
jakartaWsRsApi = "2.1.6"

# Publishing toolchain. Dokka stays on the 1.9.x line to match the pinned Kotlin 1.9.x -
# Dokka 2.x expects a newer compiler. The vanniktech plugin owns the Maven Central Portal
# upload (signed bundle + validation poll), which plain maven-publish cannot do.
dokka = "1.9.20"
vanniktechMavenPublish = "0.34.0"

# Formatting. Spotless drives the two formatters below; their versions are pinned here too so a
# formatter upgrade is a deliberate, reviewable change rather than a side effect of a plugin bump.
spotless = "8.10.2"
ktlint = "1.2.1"
googleJavaFormat = "1.26.0"

# Test-only pins (OSS test subset). junit-jupiter/vintage share one version; junit4 is the
# legacy engine the `util` suite still targets. kotlin-test tracks the Kotlin version;
# coroutines-test tracks kotlinxCoroutines; opentracing-mock tracks opentracing.
junitJupiter = "5.9.1"
junit4 = "4.13.2"
assertj = "3.27.7"
mockito = "4.11.0"
mockitoKotlin = "4.1.0"
guice = "6.0.0"
lombok = "1.18.30"
mariadb4j = "2.6.0"
mariadbJavaClient = "3.5.1"
mysqlConnectorJava = "5.1.48"

# skipper-state-machine module pins (shared catalog; core itself does not use these).
# Main deps: zstd-jni (state-codec compression); dropwizard-views(+freemarker) for the admin
# Freemarker UI — the 2.1.x line is the javax.ws.rs namespace matching the admin sources (3.x/4.x
# switched to jakarta.ws.rs). Test deps: mockk (admin resource test), logback (admin log capture).
zstdJni = "1.4.9-5"
dropwizard = "2.1.12"
mockk = "1.13.3"
logback = "1.3.7"

[libraries]
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-module-parameter-names = { module = "com.fasterxml.jackson.module:jackson-module-parameter-names", version.ref = "jackson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
vavr = { module = "io.vavr:vavr", version.ref = "vavr" }
vavr-match = { module = "io.vavr:vavr-match", version.ref = "vavr" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
libthrift = { module = "org.apache.thrift:libthrift", version.ref = "libthrift" }
javassist = { module = "org.javassist:javassist", version.ref = "javassist" }
opentracing-api = { module = "io.opentracing:opentracing-api", version.ref = "opentracing" }
opentracing-util = { module = "io.opentracing:opentracing-util", version.ref = "opentracing" }
javax-inject = { module = "javax.inject:javax.inject", version.ref = "javaxInject" }
jakarta-ws-rs-api = { module = "jakarta.ws.rs:jakarta.ws.rs-api", version.ref = "jakartaWsRsApi" }

# Test-only libraries.
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitJupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junitJupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junitJupiter" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junitJupiter" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
opentracing-mock = { module = "io.opentracing:opentracing-mock", version.ref = "opentracing" }
guice = { module = "com.google.inject:guice", version.ref = "guice" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mariadb4j = { module = "ch.vorburger.mariaDB4j:mariaDB4j", version.ref = "mariadb4j" }
mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadbJavaClient" }
mysql-connector-java = { module = "mysql:mysql-connector-java", version.ref = "mysqlConnectorJava" }

# skipper-state-machine libraries (shared catalog; core itself does not use these).
jackson-dataformat-smile = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-smile", version.ref = "jackson" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstdJni" }
dropwizard-views = { module = "io.dropwizard:dropwizard-views", version.ref = "dropwizard" }
dropwizard-views-freemarker = { module = "io.dropwizard:dropwizard-views-freemarker", version.ref = "dropwizard" }
mockk-jvm = { module = "io.mockk:mockk-jvm", version.ref = "mockk" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Applied by skipper-state-machine to both main and test compilations (its main classes subclass
# core's @SkipperOpen Workflow/Actions). Core applies all-open to its test compile only, so this
# plugin entry is unused by core.
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
